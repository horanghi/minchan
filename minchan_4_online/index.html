<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>카드 대전 — 온라인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#fdfdf8; --ink:#3a3a38; --pencil:#5b5b56; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:'Gaegu',system-ui,sans-serif;color:var(--ink);
    background:radial-gradient(circle at 30% 15%, rgba(255,255,255,.07), transparent 60%), #b0a78f;
    display:flex;justify-content:center;padding:8px;min-height:100dvh;overflow-x:hidden;
  }
  .stage{width:100%;max-width:520px;display:flex;flex-direction:column;gap:6px;align-items:center;}

  /* ===== 로그 ===== */
  .log{
    width:100%;background:rgba(253,253,248,.85);border:2.5px solid var(--pencil);border-radius:12px;
    padding:4px 12px;height:56px;overflow-y:auto;font-size:16px;line-height:1.28;
    box-shadow:2px 3px 0 rgba(0,0,0,.12);
  }
  .log p{margin:0;}
  .log .p0{color:#1a6b2e;} .log .p1{color:#1f4fa3;} .log .p2{color:#a3341f;} .log .sys{color:#6a6a6a;}

  /* ===== 순서 바 ===== */
  .orderbar{
    width:100%;background:rgba(253,253,248,.9);border:2.5px solid var(--pencil);border-radius:12px;
    padding:4px 10px;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;
    box-shadow:2px 3px 0 rgba(0,0,0,.12);font-size:16px;
  }
  .orderbar .chip{
    border:2px solid var(--pencil);border-radius:14px;padding:0 9px;background:#fff;
    font-weight:700;white-space:nowrap;font-size:15px;
  }
  /* 플레이어별 색 정체성 (로그 p0/p1/p2 와 같은 계열) — 순서 바 칩 */
  .orderbar .chip.sc0{border-color:#2f7c44;color:#1a6b2e;background:#eef7ea;}
  .orderbar .chip.sc1{border-color:#3763b0;color:#1f4fa3;background:#edf3fc;}
  .orderbar .chip.sc2{border-color:#b04a37;color:#a3341f;background:#fdf0ec;}
  .orderbar .chip.now{background:#ffe9c7;outline:2px dashed #d98a3c;outline-offset:1px;}
  .orderbar .arw{font-size:17px;color:#7a5a2e;font-weight:700;}
  .orderbar .dirlabel{font-size:14px;color:var(--pencil);margin-left:4px;white-space:nowrap;}

  /* ===== 방향 화살표 링 ===== */
  .dirRing{
    position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;z-index:1;
    --ringR:min(23vw,118px);
    animation:ringspin 16s linear infinite;
  }
  .dirRing.ccw{animation-direction:reverse;}
  @keyframes ringspin{from{transform:rotate(0);}to{transform:rotate(360deg);}}
  .dirRing span{
    position:absolute;left:0;top:0;font-size:19px;color:rgba(253,253,248,.8);
    text-shadow:1px 1px 0 rgba(0,0,0,.25);
  }

  /* ===== 아레나 ===== */
  .arena{
    position:relative;width:100%;aspect-ratio:1;max-width:520px;
    --r: min(34vw, 178px);
    /* 좁은 화면에서 맨 아래(내) 좌석 이름표가 아레나 밖으로 삐져나와 아래 라벨을 가리는 것 보정.
       넘침량 ≈ (--r + 좌석높이/2) - 아레나높이/2. 스크롤바 폭까지 감안해 여유를 둠(넓은 화면에선 0). */
    margin-bottom: max(0px, calc(88px - 16vw));
  }
  .tabletop{
    position:absolute;inset:7%;border-radius:50%;
    background:
      radial-gradient(circle at 42% 36%, rgba(255,255,255,.16), transparent 55%),
      repeating-radial-gradient(circle at 50% 50%, #9c7a4e 0 9px, #937146 9px 18px);
    border:6px solid #6e5333;
    box-shadow:inset 0 0 24px rgba(0,0,0,.28), 3px 5px 0 rgba(0,0,0,.2);
  }
  .table{position:absolute;inset:0;}
  .seat{
    position:absolute;left:50%;top:50%;width:210px;
    transform:translate(-50%,-50%) rotate(var(--a)) translateY(var(--r));
    display:flex;flex-direction:column;align-items:center;gap:3px;
  }
  .seat .fan{display:flex;justify-content:center;height:84px;align-items:flex-end;}
  .seat .fan .c{
    width:56px;height:78px;border:2px solid var(--pencil);border-radius:6px;
    background:var(--paper);box-shadow:1.5px 2.5px 0 rgba(0,0,0,.2);
    margin:0 -9px;position:relative;transform-origin:50% 95%;
    display:flex;flex-direction:column;overflow:hidden;
  }
  .seat .fan .c.back{
    background:repeating-linear-gradient(45deg,#e8e2d2 0 6px,#dcd4bf 6px 12px);
  }
  .seat .fan .c.back::after{
    content:'🐸';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:22px;opacity:.75;
  }
  .seat.dead{opacity:.45;filter:grayscale(1);}
  .seat .info{
    background:rgba(253,253,248,.94);border:2.5px solid var(--pencil);border-radius:11px;
    padding:2px 10px;text-align:center;box-shadow:2px 3px 0 rgba(0,0,0,.15);min-width:128px;
  }
  .seat .info .nm{font-size:16px;font-weight:700;line-height:1.1;white-space:nowrap;}
  .seat .info .nm .me{color:#7a2a2a;font-size:12px;}
  /* 플레이어별 색 정체성 — 좌석 이름표 (색 테두리 + 옅은 색 종이 틴트 + 이름 색) */
  .seat.sc0 .info{border-color:#2f7c44;background:rgba(235,247,233,.94);box-shadow:2px 3px 0 rgba(26,107,46,.22);}
  .seat.sc0 .info .nm{color:#1a6b2e;}
  .seat.sc1 .info{border-color:#3763b0;background:rgba(233,240,251,.94);box-shadow:2px 3px 0 rgba(31,79,163,.22);}
  .seat.sc1 .info .nm{color:#1f4fa3;}
  .seat.sc2 .info{border-color:#b04a37;background:rgba(251,236,232,.94);box-shadow:2px 3px 0 rgba(163,52,31,.22);}
  .seat.sc2 .info .nm{color:#a3341f;}
  /* 내 자리 강조: 크레파스로 한 번 더 두른 느낌 (turnGlow/targetable 은 outline 이라 안 겹침) */
  .seat.mine .info{border-width:3.5px;box-shadow:0 0 0 3px rgba(255,233,199,.95),2px 3px 0 rgba(0,0,0,.18);}
  /* 체력 10개(회복 포션으로 더 늘 수도)라 하트가 길어짐 — 살짝 줄이고, 넘치면 줄바꿈 */
  .seat .info .hp{font-size:11px;line-height:1.18;letter-spacing:-.3px;overflow-wrap:anywhere;}
  .seat .info .bd{font-size:11px;line-height:1.2;min-height:13px;}
  .seat.turnGlow .info{outline:3px dashed #d98a3c;outline-offset:2px;}
  .seat.targetable .info{outline:3px solid #c0392b;outline-offset:2px;cursor:pointer;animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{outline-color:#c0392b;}50%{outline-color:#ff8a70;}}

  /* ===== 중앙 공개 영역 ===== */
  .centerZone{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;width:190px;
  }
  .turnTag{
    font-size:15px;font-weight:700;background:rgba(253,253,248,.95);
    border:2px solid var(--pencil);border-radius:14px;padding:0 10px;
    box-shadow:1.5px 2px 0 rgba(0,0,0,.15);white-space:nowrap;
  }
  .pile{position:relative;width:126px;height:146px;}
  .pile .pc{
    position:absolute;left:50%;top:50%;width:94px;height:128px;
    background:var(--paper);border:2.5px solid var(--pencil);border-radius:9px;
    box-shadow:2px 3px 0 rgba(0,0,0,.22), inset 0 0 0 2px rgba(255,255,255,.55);
    display:flex;flex-direction:column;overflow:hidden;
    transform:translate(-50%,-50%) rotate(var(--tilt,0deg));
  }
  .pile .pc.pop{animation:slam .3s ease-out;}
  @keyframes slam{0%{transform:translate(-50%,-160%) rotate(0) scale(1.3);opacity:.4;}100%{transform:translate(-50%,-50%) rotate(var(--tilt)) scale(1);opacity:1;}}
  .pile .pc .t{font-size:14.5px;font-weight:700;text-align:center;border-bottom:2px solid var(--pencil);padding:1px;white-space:nowrap;overflow:hidden;}
  .pile .pc .a{flex:1;display:flex;align-items:center;justify-content:center;font-size:48px;}
  .pile .pc .d{font-size:12px;text-align:center;border-top:2px solid var(--pencil);padding:1px;line-height:1.1;}
  /* 좁은 폰 화면에서는 중앙 카드를 한 단계 줄여 좌석·덱 표시와의 겹침을 완화 (그래도 기존보다 큼) */
  @media (max-width:430px){
    .pile{width:112px;height:132px;}
    .pile .pc{width:86px;height:118px;}
    .pile .pc .a{font-size:42px;}
  }
  .pile .who{
    position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);
    font-size:12.5px;background:#ffe9c7;border:2px solid #d98a3c;border-radius:12px;padding:0 8px;white-space:nowrap;
  }
  .pile .empty{
    position:absolute;inset:8px 14px;border:2.5px dashed rgba(253,253,248,.65);border-radius:9px;
    display:flex;align-items:center;justify-content:center;font-size:13px;color:rgba(253,253,248,.9);text-align:center;line-height:1.2;
  }
  .deckTag{font-size:12.5px;color:#fdfdf8;text-shadow:1px 1px 0 rgba(0,0,0,.35);}

  /* ===== 하단 조작 ===== */
  .prompt{text-align:center;font-size:17px;color:#7a2222;min-height:24px;background:rgba(253,253,248,.7);border-radius:10px;padding:0 12px;}
  .prompt:empty{background:transparent;}
  .prompt button{font-family:'Gaegu';font-size:14px;font-weight:700;background:#fff;border:2px solid var(--pencil);border-radius:8px;padding:0 9px;cursor:pointer;margin-left:6px;}
  .controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
  button.btn{
    font-family:'Gaegu';font-size:17px;font-weight:700;background:#fdfdf8;
    border:2.5px solid var(--pencil);border-radius:10px;padding:4px 13px;cursor:pointer;
    box-shadow:2px 3px 0 rgba(0,0,0,.15);color:var(--ink);
  }
  button.btn:active{transform:translate(1px,2px);box-shadow:1px 1px 0 rgba(0,0,0,.15);}
  button.btn:disabled{opacity:.4;cursor:default;}
  .hint{color:#fdfdf8;font-size:13px;text-align:center;text-shadow:1px 1px 0 rgba(0,0,0,.3);opacity:.9;}

  /* ===== 하단 손패 ===== */
  .handlabel{width:100%;color:#fdfdf8;font-size:18px;text-shadow:1px 1px 0 rgba(0,0,0,.3);margin:0 4px;display:flex;justify-content:space-between;align-items:center;}
  /* --fs: 손패 장수별 글자 배율(JS 지정). 카드 높이는 .art 의 min-height 로 결정(플렉스 stretch 와 충돌 없음) */
  .myhand{width:100%;display:flex;gap:7px;justify-content:center;min-height:118px;--fs:1;flex-shrink:0;} /* 화면이 낮아도 카드가 눌려 잘리지 않게 */
  .myhand .card{
    flex:1 1 0;max-width:132px;background:var(--paper);
    border:2.5px solid var(--pencil);border-radius:10px;
    box-shadow:2px 4px 0 rgba(0,0,0,.18), inset 0 0 0 2px rgba(255,255,255,.55);cursor:pointer;
    display:flex;flex-direction:column;
    transition:transform .12s, box-shadow .12s;
    position:relative;overflow:hidden;
  }
  .myhand .card:hover,.myhand .card:focus-visible{transform:translateY(-7px) rotate(-1deg);box-shadow:4px 8px 0 rgba(0,0,0,.22), inset 0 0 0 2px rgba(255,255,255,.55);outline:none;}
  .myhand .card:active{transform:translateY(-3px);}
  .myhand .card.sel{transform:translateY(-9px);outline:3px solid #c0392b;}
  .myhand .card.disabled{opacity:.5;filter:grayscale(.45);cursor:default;pointer-events:none;box-shadow:1px 2px 0 rgba(0,0,0,.15);}
  /* 손패 5장(카드 폭 축소)에도 넘치지 않도록 장수에 따라 글자 배율(--fs)을 조절 */
  .myhand .card .title{font-size:calc(19px*var(--fs));font-weight:700;text-align:center;padding:2px;border-bottom:2px solid var(--pencil);line-height:1.05;white-space:nowrap;overflow:hidden;flex-shrink:0;}
  .myhand .card .art{flex:1;display:flex;align-items:center;justify-content:center;font-size:calc(54px*var(--fs));min-height:calc(116px*var(--fs));}
  .myhand .card .desc{font-size:calc(15px*var(--fs));text-align:center;padding:2px;border-top:2px solid var(--pencil);line-height:1.08;min-height:30px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .myhand .card.atk .art{color:#7a2a2a;} .myhand .card.heal .art{color:#2a6a3a;} .myhand .card.buff .art{color:#b58900;}
  .myhand .wait{color:#fdfdf8;font-size:17px;text-shadow:1px 1px 0 rgba(0,0,0,.3);align-self:center;}

  /* ===== 카드 꾸미기: 종류별 테마 + 이모지 광채 + 반짝임 + 홀로그램 광택 ===== */
  /* 종류별 배경 그라데이션·테두리 (손패 + 중앙 공개 카드 공통) */
  .myhand .card.atk,.pile .pc.atk{border-color:#8a4a3a;background:linear-gradient(165deg,#fff6ee 0%,#ffe3cd 55%,#ffcfae 100%);}
  .myhand .card.heal,.pile .pc.heal{border-color:#3f7a4a;background:linear-gradient(165deg,#f3fbf0 0%,#dcf2d3 55%,#c2e8ba 100%);}
  .myhand .card.buff,.pile .pc.buff{border-color:#a8842e;background:linear-gradient(165deg,#fffbe8 0%,#ffefbb 55%,#ffe294 100%);}
  /* 제목 띠·설명 띠 틴트 */
  .myhand .card.atk .title,.pile .pc.atk .t{background:rgba(255,182,150,.45);color:#7a2a2a;}
  .myhand .card.heal .title,.pile .pc.heal .t{background:rgba(176,226,166,.45);color:#245c32;}
  .myhand .card.buff .title,.pile .pc.buff .t{background:rgba(255,222,132,.5);color:#7a5a10;}
  .myhand .card .desc,.pile .pc .d{background:rgba(255,255,255,.55);}
  /* 이모지 뒤 방사형 광채 + 입체 그림자 */
  .myhand .card .art,.pile .pc .a{position:relative;}
  .myhand .card.atk .art,.pile .pc.atk .a{color:#7a2a2a;background:radial-gradient(circle at 50% 46%,rgba(255,138,64,.42) 0%,rgba(255,138,64,0) 62%);filter:drop-shadow(0 2px 2px rgba(0,0,0,.22)) drop-shadow(0 0 7px rgba(255,120,40,.55));}
  .myhand .card.heal .art,.pile .pc.heal .a{color:#2a6a3a;background:radial-gradient(circle at 50% 46%,rgba(110,205,120,.42) 0%,rgba(110,205,120,0) 62%);filter:drop-shadow(0 2px 2px rgba(0,0,0,.22)) drop-shadow(0 0 7px rgba(70,180,90,.55));}
  .myhand .card.buff .art,.pile .pc.buff .a{color:#b58900;background:radial-gradient(circle at 50% 46%,rgba(255,205,70,.5) 0%,rgba(255,205,70,0) 62%);filter:drop-shadow(0 2px 2px rgba(0,0,0,.22)) drop-shadow(0 0 7px rgba(255,190,40,.6));}
  /* 모서리 반짝이 별 (색은 종류별 아트 색을 따라감) */
  .myhand .card .art::before,.pile .pc .a::before{content:'✦';position:absolute;top:4%;left:8%;font-size:15px;animation:twinkle 1.8s ease-in-out infinite;}
  .myhand .card .art::after,.pile .pc .a::after{content:'✧';position:absolute;bottom:6%;right:9%;font-size:13px;animation:twinkle 1.8s ease-in-out .9s infinite;}
  @keyframes twinkle{0%,100%{opacity:.2;transform:scale(.75) rotate(-8deg);}50%{opacity:.95;transform:scale(1.15) rotate(8deg);}}
  /* 홀로그램 광택 (은은한 빛줄기 스윕) */
  .myhand .card::before,.pile .pc::before{
    content:'';position:absolute;top:-30%;bottom:-30%;left:0;width:42%;z-index:1;pointer-events:none;
    background:linear-gradient(105deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.45) 50%,rgba(255,255,255,0) 100%);
    transform:skewX(-16deg) translateX(-180%);animation:sheen 4.6s ease-in-out infinite;
  }
  .myhand .card.disabled::before{display:none;} /* 비활성 카드는 광택 없음 */
  @keyframes sheen{0%,58%{transform:skewX(-16deg) translateX(-180%);}88%,100%{transform:skewX(-16deg) translateX(430%);}}
  @media (prefers-reduced-motion:reduce){
    .myhand .card::before,.pile .pc::before{display:none;}
    .myhand .card .art::before,.pile .pc .a::before,.myhand .card .art::after,.pile .pc .a::after{animation:none;opacity:.6;}
  }

  /* ===== 오버레이 / 로비 ===== */
  .overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(40,36,28,.78);z-index:20;padding:18px;}
  .overlay.show{display:flex;}
  .panel{
    background:var(--paper);border:3px solid var(--pencil);border-radius:16px;
    padding:22px 24px;text-align:center;box-shadow:4px 6px 0 rgba(0,0,0,.3);
    width:100%;max-width:360px;
  }
  .panel h1{font-size:30px;margin-bottom:10px;}
  .panel p{font-size:18px;color:var(--pencil);margin-bottom:12px;}
  .bigbtn{font-family:'Gaegu';font-size:21px;font-weight:700;background:#ffe9c7;border:3px solid var(--pencil);border-radius:12px;padding:8px 26px;cursor:pointer;box-shadow:3px 4px 0 rgba(0,0,0,.2);margin-top:8px;width:100%;}
  .bigbtn:active{transform:translate(1px,2px);}
  .bigbtn:disabled{opacity:.45;cursor:default;}
  .inp{font-family:'Gaegu';font-size:19px;font-weight:700;width:100%;padding:7px 12px;border:2.5px solid var(--pencil);border-radius:10px;margin:6px 0;text-align:center;background:#fff;color:var(--ink);}
  .inp.code{text-transform:uppercase;letter-spacing:5px;font-size:26px;}
  .or{color:var(--pencil);margin:12px 0 4px;font-size:15px;}
  .joinrow{display:flex;gap:8px;align-items:center;justify-content:center;}
  .joinrow .inp{margin:0;flex:1;}
  .joinrow .btn{white-space:nowrap;}
  .cst{color:var(--pencil);font-size:15px;margin-top:10px;min-height:20px;}
  .roomcode{font-size:44px;font-weight:700;letter-spacing:8px;color:#7a2a2a;margin:2px 0 10px;}
  /* ===== 방 목록 ===== */
  .roomlist{display:flex;flex-direction:column;gap:6px;max-height:190px;overflow-y:auto;margin-top:2px;}
  .rl-empty{color:var(--pencil);font-size:15px;padding:10px 0;line-height:1.3;}
  .rl-item{
    font-family:'Gaegu';display:flex;align-items:center;gap:8px;width:100%;
    background:#fff;border:2.5px solid var(--pencil);border-radius:11px;
    padding:5px 10px;cursor:pointer;text-align:left;color:var(--ink);
    box-shadow:2px 3px 0 rgba(0,0,0,.15);
  }
  .rl-item:active{transform:translate(1px,2px);box-shadow:1px 1px 0 rgba(0,0,0,.15);}
  .rl-item .rl-code{font-size:21px;font-weight:700;letter-spacing:2px;color:#7a2a2a;min-width:62px;}
  .rl-item .rl-who{flex:1;font-size:15px;color:var(--pencil);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rl-item .rl-state{font-size:14px;font-weight:700;background:#ffe9c7;border:2px solid #d98a3c;border-radius:11px;padding:0 8px;white-space:nowrap;}
  .rl-item.off{opacity:.5;cursor:default;}
  .rl-item.off .rl-state{background:#e9e6dd;border-color:#a8a49a;}

  .players{margin:12px 0;display:flex;flex-direction:column;gap:5px;}
  .players .pl{font-size:19px;font-weight:700;background:#fff;border:2px solid var(--pencil);border-radius:9px;padding:4px 8px;}

  #toast{
    position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-20px);
    background:#3a3a38;color:#fdfdf8;font-size:16px;font-weight:700;
    padding:8px 16px;border-radius:12px;box-shadow:2px 3px 0 rgba(0,0,0,.3);
    opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:40;max-width:90%;text-align:center;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="stage">
  <div class="log" id="log"></div>
  <div class="orderbar" id="orderBar"></div>

  <div class="arena" id="arena">
    <div class="tabletop"></div>

</div>

<div class="overlay show" id="lobby">
  <div class="panel">
    <h1>🌐 카드 대전 온라인</h1>
    <div id="lobbyEntry">
      <p>이름을 정하고, 방을 만들거나<br>코드로 들어가요</p>
      <input id="nickInput" class="inp" maxlength="10" placeholder="내 이름 (최대 10자)">

<div id="toast"></div>

<script type="module">
import * as PS from "https://esm.sh/partysocket@1.3.0";
const PartySocket = PS.PartySocket || PS.default;

// ===== 카드 (렌더용, 서버와 동일 정의) =====
const CARDS = {
  bow:{name:'중세 활',art:'🏹',cls:'atk',dmg:2,desc:'2 데미지'},
  sword:{name:'중세 검',art:'🗡️',cls:'atk',dmg:2,desc:'2 데미지'},
  axe:{name:'돌깨는 도끼',art:'🪓',cls:'atk',dmg:3,desc:'3 데미지'},
  greatsword:{name:'중세 대검',art:'⚔️',cls:'atk',dmg:5,rest:true,desc:'5뎀·다음턴 쉬기'},
  shotgun:{name:'샷건',art:'💥',cls:'atk',dmg:3,desc:'3 데미지'},
  fireball:{name:'파이어볼',art:'🔥',cls:'atk',dmg:4,desc:'4 데미지'},
  lightning:{name:'번개 마법',art:'⚡',cls:'atk',dmg:3,pierce:true,desc:'3뎀·방패무시'},
  poison:{name:'독 물약',art:'☠️',cls:'atk',poison:3,desc:'3턴 독'},
  freeze:{name:'얼음 마법',art:'❄️',cls:'atk',freeze:true,desc:'1턴 얼리기'},
  vampire:{name:'흡혈 박쥐',art:'🦇',cls:'atk',dmg:2,lifesteal:2,desc:'2뎀+2회복'},
  bomb:{name:'폭탄',art:'💣',cls:'atk',dmg:4,selfdmg:1,desc:'4뎀·내체력-1'},
  meteor:{name:'메테오',art:'☄️',cls:'atk',all:2,desc:'모두에게 2뎀'},
  parsley:{name:'파슬리 인형',art:'🐸',cls:'heal',dmg:1,heal:1,desc:'1회복+1뎀'},
  shield:{name:'방패',art:'🛡️',cls:'buff',shield:true,desc:'공격 막기'},
  star:{name:'슈퍼 별',art:'⭐',cls:'buff',star:true,desc:'1턴 무적'},
  meat:{name:'만화 고기',art:'🍗',cls:'heal',heal:2,desc:'2 회복'},
  beer:{name:'생맥주',art:'🍺',cls:'heal',heal:1,desc:'1 회복'},
  cake:{name:'케이크',art:'🎂',cls:'heal',heal:4,desc:'4 회복'},
  snack:{name:'스낵',art:'🍟',cls:'heal',heal:2,desc:'2 회복'},
  elixir:{name:'생명의 물',art:'💧',cls:'heal',fullheal:true,desc:'가득 회복'},
  potion:{name:'회복 포션',art:'🧪',cls:'buff',maxhp:1,desc:'최대체력 +1'},
  scroll:{name:'마법 두루마리',art:'📜',cls:'buff',drawcards:2,desc:'2장 뽑기·턴유지'},
  reroll:{name:'리롤',art:'🔄',cls:'buff',reroll:true,desc:'손패 새로·턴유지'},
  reverse:{name:'리버스',art:'🔃',cls:'buff',reverse:true,desc:'진행 방향 반대로!'},
  dev:{name:'개발자의 권능',art:'🌞',cls:'buff',steal:true,desc:'카드 뺏기·턴유지'},
};

// 실시간 서버는 Cloudflare Workers 에 배포됩니다.
// ⚠️ 배포 후 `npx wrangler deploy` 가 출력하는 주소
//    https://minchan-card.<서브도메인>.workers.dev 의 호스트로 아래 값을 교체해야 합니다.
const WORKERS_HOST = 'minchan-card.changame.workers.dev'; // 워커 이름(minchan-card) + 계정 서브도메인(changame)
const IS_LOCAL_DEV = ['localhost','127.0.0.1'].includes(location.hostname)
  || /^(192\.168\.|10\.|172\.(1[6-9]|2\d|3[01])\.)/.test(location.hostname); // 같은 공유기(LAN) 테스트 포함
const PARTY_HOST = IS_LOCAL_DEV
  ? `${location.hostname}:8787`   // wrangler dev 기본 포트
  : WORKERS_HOST;

const CODE_ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // 혼동 문자(0/O/1/I/L) 제외
const genCode = () => Array.from({length:4}, () => CODE_ALPHABET[Math.random()*CODE_ALPHABET.length|0]).join('');
const $ = id => document.getElementById(id);

let socket=null, roomCode=null, mySeat=null, joined=false, S=null, pending=null, lastSeq=0, builtSeatCount=0, builtMySeat=null;

// ===== 토스트 =====
let toastTimer=null;
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2600);
}

// ===== 로비 진입 =====
// 다른 사용자가 입력한 이름이 innerHTML 로 들어가므로 반드시 이스케이프
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function initLobby(){
  $('nickInput').value = localStorage.getItem('mc4:nick') || '';
  const params = new URLSearchParams(location.search);
  const r = (params.get('room')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);
  if(r) $('codeInput').value = r;
  showEntry();
  connectLobbyList();
}

// ===== 방 목록(등록소) =====
let lobbySocket=null;
function connectLobbyList(){
  if(lobbySocket) return;
  try{
    lobbySocket = new PartySocket({ host:PARTY_HOST, party:'lobby', room:'global' });
    lobbySocket.addEventListener('message', e=>{
      let m; try{ m=JSON.parse(e.data); }catch(err){ return; }
      if(m.type==='rooms') renderRooms(m.rooms);
    });
    lobbySocket.addEventListener('error', ()=>{});
  }catch(e){ /* 목록을 못 받아도 코드 입력으로는 들어갈 수 있으니 조용히 무시 */ }
}
function closeLobbyList(){
  if(!lobbySocket) return;
  try{ lobbySocket.close(); }catch(e){}
  lobbySocket=null;
}
function renderRooms(rooms){
  const box=$('roomList'); if(!box) return;
  if(!rooms || !rooms.length){
    box.innerHTML='<div class="rl-empty">아직 열린 방이 없어요.<br>먼저 방을 만들어 보세요!</div>';
    return;
  }
  box.innerHTML = rooms.map(r=>{
    const playing = r.phase!=='lobby';
    const full = r.players>=3;
    const off = playing || full;
    const who = (r.names||[]).map(esc).join(', ') || '—';
    const state = playing ? '게임 중' : (full ? '꽉 참' : `${r.players}/3 대기`);
    return `<button class="rl-item${off?' off':''}" data-code="${esc(r.code)}"${off?' disabled':''}>
      <span class="rl-code">${esc(r.code)}</span>
      <span class="rl-who">${who}</span>
      <span class="rl-state">${state}</span>
    </button>`;
  }).join('');
  box.querySelectorAll('.rl-item:not([disabled])').forEach(b=>{
    b.onclick=()=>{ $('codeInput').value=b.dataset.code; joinRoom(); };
  });
}
function showEntry(){
  $('lobby').classList.add('show');
  $('lobbyEntry').style.display='';
  $('lobbyWait').style.display='none';
  connectLobbyList(); // 입장 화면에서는 방 목록을 계속 갱신
}
function readNick(){
  let n=($('nickInput').value||'').trim().slice(0,10);
  if(!n) n='플레이어';
  localStorage.setItem('mc4:nick', n);
  return n;
}
function createRoom(){ readNick(); connectRoom(genCode()); }
function joinRoom(){
  const c=($('codeInput').value||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);
  if(c.length<4){ toast('방 코드 4자리를 입력해요'); return; }
  readNick(); connectRoom(c);
}
function connectRoom(code){
  closeLobbyList(); // 방에 들어가면 목록 구독은 끊는다
  roomCode=code;
  const url=new URL(location.href); url.searchParams.set('room',code);
  history.replaceState(null,'',url);
  if(socket){ try{socket.close();}catch(e){} }
  joined=false; mySeat=null; S=null; lastSeq=0; pending=null; builtSeatCount=0; builtMySeat=null;
  $('connState').textContent='접속 중…';
  // PartyKit room 이름은 대소문자 구분 없이 소문자로 통일
  socket=new PartySocket({ host:PARTY_HOST, room:code.toLowerCase() });
  socket.addEventListener('open', ()=>{
    socket.send(JSON.stringify({ type:'join', name:readNick(), token: localStorage.getItem('mc4:'+code)||undefined }));
    $('connState').textContent='';
  });
  socket.addEventListener('close', ()=>{ if(joined) toast('🔌 연결이 끊겼어요. 재접속 중…'); });
  socket.addEventListener('message', e=>{
    let m; try{ m=JSON.parse(e.data); }catch(err){ return; }
    handle(m);
  });
}

// ===== 서버 메시지 =====
function handle(m){
  if(m.type==='hello') return;
  if(m.type==='error'){ toast(m.msg); if(!joined) showEntry(); return; }
  if(m.type==='joined'){
    joined=true; mySeat=m.seat;
    if(m.token) localStorage.setItem('mc4:'+roomCode, m.token);
    return;
  }
  if(m.type==='state'){
    S=m;
    if(m.you && m.you.seat!=null) mySeat=m.you.seat;
    if(joined) renderAll();
    return;
  }
}

// ===== 렌더 디스패치 =====
function renderAll(){
  const v=S.view;
  if(!v || v.phase==='lobby'){ showWait(); return; }
  $('lobby').classList.remove('show');
  ensureSeats(v.players.length);
  renderArena();
  if(v.phase==='over') showBanner(); else $('banner').classList.remove('show');
}

function showWait(){
  $('lobby').classList.add('show');
  $('lobbyEntry').style.display='none';
  $('lobbyWait').style.display='';
  $('roomCodeBig').textContent = roomCode || '';
  const ps = (S&&S.view&&S.view.players) || [];
  $('lobbyPlayers').innerHTML = ps.map(p =>
    `<div class="pl">${esc(p.name)}${p.seat===mySeat?' <b>(나)</b>':''}${p.connected?'':' 📵'}</div>`).join('') || '<div class="pl">…</div>';
  const isHost = mySeat===0, enough = ps.length>=2;
  $('startBtn').style.display = isHost?'':'none';
  $('startBtn').disabled = !enough;
  $('waitMsg').textContent = isHost
    ? (enough ? `${ps.length}명 · 준비되면 시작!` : '2명 이상 모이면 시작할 수 있어요')
    : '방장이 시작하기를 기다려요…';
}

// ===== 좌석 =====
// 인원수(n)뿐 아니라 내 좌석(mySeat)이 바뀌어도 다시 배치한다
function ensureSeats(n){ if(builtSeatCount!==n || builtMySeat!==mySeat) buildSeats(n); }
function buildSeats(n){
  const t=$('table'); t.innerHTML='';
  const base = (mySeat!=null) ? mySeat : 0; // 내 좌석을 아직 모르면 seat0 기준
  for(let i=0;i<n;i++){
    const s=document.createElement('div');
    s.className='seat sc'+(i%3); s.id='seat'+i; // id 는 실제 seat 번호 유지 (renderArena/seatClick 이 참조)
    // 보는 사람 기준 회전: 내 자리(base)가 항상 아래(0도)에 오도록
    const ang = ((i - base + n) % n) * (360/n);
    s.style.setProperty('--a', ang+'deg');
    s.innerHTML=`<div class="fan"></div><div class="info"><div class="nm"></div><div class="hp"></div><div class="bd"></div></div>`;
    const info=s.querySelector('.info');
    info.style.transform=`rotate(${-ang}deg)`; // 이름표는 항상 수평 유지
    info.onclick=()=>seatClick(i);
    t.appendChild(s);
  }
  builtSeatCount=n; builtMySeat=mySeat;
}

// ===== 표시 헬퍼 =====
// (좌석 색 아이콘 🟢🔵🔴 은 서버가 이미 p.name 앞에 붙여서 보내준다)
function hearts(f){ let s=''; for(let i=0;i<f.max;i++) s+= i<f.hp?'❤️':'🖤'; return s+` (${f.hp}/${f.max})`; }
function badgeTxt(f){
  if(f.dead) return '💀 탈락';
  const b=[];
  if(f.shield)b.push('🛡️방패'); if(f.star)b.push('⭐무적');
  if(f.poison>0)b.push('☠️독'+f.poison); if(f.skip)b.push('❄️쉬기');
  if(!f.connected)b.push('📵끊김');
  return b.join(' ');
}
function isMyTurn(){
  const v=S&&S.view; if(!v||v.phase!=='playing') return false;
  const me=v.players[mySeat];
  return v.cur===mySeat && me && !me.dead;
}
function turnOrderList(){
  const v=S.view, ps=v.players, n=ps.length;
  const al=ps.filter(p=>!p.dead); if(!al.length) return [];
  const list=[v.cur]; let j=v.cur;
  for(let k=0;k<al.length-1;k++){ do{ j=(j+v.dir+n)%n; }while(ps[j].dead); list.push(j); }
  return list;
}

// ===== 아레나 =====
function renderArena(){
  const v=S.view, ps=v.players, over=v.phase==='over';
  const order=turnOrderList(); const nextId=order.length>1?order[1]:null;
  ps.forEach((p,i)=>{
    const s=$('seat'+i); if(!s) return;
    const isTurn=v.cur===i && !over && !p.dead;
    s.classList.toggle('dead',p.dead);
    s.classList.toggle('mine', p.seat===mySeat); // 내 자리 강조
    s.classList.toggle('turnGlow',isTurn);
    s.classList.toggle('targetable', !!pending && i!==mySeat && !p.dead && isMyTurn());
    const fan=s.querySelector('.fan'); fan.innerHTML='';
    const n=p.handCount;
    for(let idx=0; idx<n; idx++){
      const el=document.createElement('div'); el.className='c back';
      const rot=(idx-(n-1)/2)*10, lift=Math.abs(idx-(n-1)/2)*5;
      el.style.transform=`rotate(${rot}deg) translateY(${lift}px)`;
      if(p.dead) el.style.display='none';
      fan.appendChild(el);
    }
    const info=s.querySelector('.info');
    info.querySelector('.nm').innerHTML = esc(p.name) + (p.seat===mySeat?' <span class="me">(나)</span>':'');
    info.querySelector('.hp').innerHTML=hearts(p);
    const extra=(!over&&nextId===i&&!isTurn)?'👉 다음 차례  ':'';
    info.querySelector('.bd').textContent=extra+badgeTxt(p);
  });
  $('turnTag').textContent = over?'게임 끝!':`${ps[v.cur].name} 차례`;
  $('deckTag').textContent = `덱 ${v.deckCount}장 · 방향 ${v.dir===1?'↻ 시계':'↺ 반시계'}`;
  renderPile(); renderOrderBar(); updateDirRing(); renderMyHand(); renderLog();
  const pr=$('prompt');
  if(pending){
    pr.innerHTML=`🎯 공격할 상대의 이름표를 누르세요 <button id="cancelBtn">취소</button>`;
    $('cancelBtn').onclick=cancelPending;
  } else pr.innerHTML='';
  $('rerollBtn').disabled = !isMyTurn() || !!pending;
}

function renderMyHand(){
  const v=S.view, over=v.phase==='over', me=v.players[mySeat];
  const box=$('myHand'); box.innerHTML='';
  const myTurn=isMyTurn();
  const curName = v.players[v.cur] ? v.players[v.cur].name : '';
  $('dirTag').textContent=`내는 순서 ${v.dir===1?'↻ 시계방향':'↺ 반시계방향'}`;
  $('handOwner').textContent = over ? '게임 끝' : (myTurn ? '내 카드 (눌러서 내기)' : (me&&me.dead ? '관전 중' : `${curName} 차례…`));
  const hand = (S.you && S.you.hand) || [];
  if(!hand.length){
    box.innerHTML=`<div class="wait">${over?'🏁':(me&&me.dead?'💀 탈락했어요':'카드 없음')}</div>`;
    return;
  }
  // 손패 장수에 따라 카드 글자 배율 조절 (5장까지 폰 화면에서 안 넘치게)
  box.style.setProperty('--fs', hand.length>=5 ? '0.7' : (hand.length===4 ? '0.85' : '1'));
  const enabled = myTurn && !(me&&me.dead);
  hand.forEach((key,idx)=>{
    const c=CARDS[key]; const div=document.createElement('div');
    div.className='card '+c.cls+(pending&&pending.idx===idx?' sel':'')+(enabled?'':' disabled');
    div.innerHTML=`<div class="title">${c.name}</div><div class="art">${c.art}</div><div class="desc">${c.desc}</div>`;
    if(enabled){
      div.tabIndex=0; div.setAttribute('role','button');
      div.onclick=()=>humanPick(idx);
      div.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); humanPick(idx); } };
    }
    box.appendChild(div);
  });
}

function renderPile(){
  const v=S.view, box=$('pile'); box.innerHTML='';
  const pile=v.pile||[];
  if(!pile.length){ box.innerHTML='<div class="empty">여기에 카드가<br>공개돼요</div>'; return; }
  const show=pile.slice(-3);
  let maxSeq=lastSeq;
  show.forEach((e,i)=>{
    const c=CARDS[e.key]; const d=document.createElement('div');
    d.className='pc '+c.cls+((i===show.length-1 && e.seq>lastSeq)?' pop':''); // 종류별 테마 적용
    d.style.setProperty('--tilt',e.tilt+'deg'); d.style.zIndex=i;
    d.innerHTML=`<div class="t">${c.name}</div><div class="a">${c.art}</div><div class="d">${c.desc}</div>`;
    box.appendChild(d);
    if(e.seq>maxSeq) maxSeq=e.seq;
  });
  lastSeq=maxSeq;
  const last=show[show.length-1];
  const who=document.createElement('div'); who.className='who'; who.textContent=last.by;
  box.appendChild(who);
}

function renderOrderBar(){
  const v=S.view, bar=$('orderBar');
  if(v.phase==='over'){ bar.innerHTML='<span class="dirlabel">게임 끝!</span>'; return; }
  const order=turnOrderList(); const label=['지금','다음','그다음'];
  let html='';
  order.forEach((pid,k)=>{
    const p=v.players[pid];
    if(k>0) html+=`<span class="arw">➜</span>`;
    html+=`<span class="chip sc${pid%3}${k===0?' now':''}">${k<label.length?label[k]+' ':''}${esc(p.name)}</span>`;
  });
  html+=`<span class="arw">↩</span><span class="dirlabel">${v.dir===1?'↻ 시계방향':'↺ 반시계방향'}으로 반복</span>`;
  bar.innerHTML=html;
}
function updateDirRing(){
  const v=S.view, ring=$('dirRing');
  ring.classList.toggle('ccw',v.dir===-1);
  ring.innerHTML='';
  for(let i=0;i<6;i++){
    const s=document.createElement('span'); const ang=i*60;
    s.style.transform=`rotate(${ang}deg) translateY(calc(var(--ringR) * -1)) rotate(${v.dir===1?90:-90}deg) translate(-50%,-50%)`;
    s.textContent='➤'; ring.appendChild(s);
  }
}
function renderLog(){
  const el=$('log'); el.innerHTML='';
  (S.view.logs||[]).forEach(l=>{
    const p=document.createElement('p');
    p.className=(typeof l.who==='number')?('p'+l.who):(l.who||'sys');
    p.textContent=l.txt; el.appendChild(p);
  });
  el.scrollTop=el.scrollHeight;
}

// ===== 입력 =====
function humanPick(idx){
  if(!isMyTurn()||pending) return;
  const v=S.view, key=S.you.hand[idx], c=CARDS[key];
  const needTarget=(c.dmg||c.poison||c.freeze||c.steal)&&!c.all;
  const foes=v.players.filter(p=>!p.dead&&p.seat!==mySeat);
  if(needTarget&&foes.length>1){ pending={idx}; renderArena(); return; }
  send({ type:'play', cardIdx:idx, targetSeat: needTarget ? (foes[0]&&foes[0].seat) : undefined });
}
function seatClick(seat){
  if(!pending) return;
  const t=S.view.players.find(p=>p.seat===seat);
  if(!t||t.dead||t.seat===mySeat) return;
  const idx=pending.idx; pending=null;
  send({ type:'play', cardIdx:idx, targetSeat:seat });
}
function cancelPending(){ pending=null; renderArena(); }
function doReroll(){ if(!isMyTurn()||pending) return; send({type:'reroll'}); }
function startGame(){ send({type:'start'}); }
function doRestart(){ send({type:'restart'}); }
function send(o){ if(socket && socket.readyState===1) socket.send(JSON.stringify(o)); }

// ===== 배너 =====
function showBanner(){
  const v=S.view;
  const w = v.winnerSeat!=null ? v.players.find(p=>p.seat===v.winnerSeat) : null;
  $('bannerTitle').textContent='🏆 '+(w? w.name+' 승리!':'무승부');
  $('bannerMsg').textContent = w?'마지막까지 살아남았어요!':'모두 쓰러졌어요…';
  const host=mySeat===0;
  $('bannerBtn').textContent = host?'↺ 다시 하기':'방장을 기다려요…';
  $('bannerBtn').disabled=!host;
  $('banner').classList.add('show');
}

// ===== 초대/나가기 =====
async function copyInvite(){
  try{ await navigator.clipboard.writeText(location.href); toast('초대 링크 복사됨! 친구에게 보내요 🔗'); }
  catch(e){ toast(location.href); }
}
function leave(){
  try{ socket&&socket.close(); }catch(e){}
  const u=new URL(location.href); u.searchParams.delete('room');
  history.replaceState(null,'',u);
  location.reload();
}

// ===== 배선 =====
$('createBtn').onclick=createRoom;
$('joinBtn').onclick=joinRoom;
$('codeInput').addEventListener('keydown',e=>{ if(e.key==='Enter') joinRoom(); });
$('nickInput').addEventListener('keydown',e=>{ if(e.key==='Enter') createRoom(); });
$('copyBtn').onclick=copyInvite;
$('startBtn').onclick=startGame;
$('rerollBtn').onclick=doReroll;
$('inviteBtn').onclick=copyInvite;
$('leaveBtn').onclick=leave;
$('bannerBtn').onclick=doRestart;

initLobby();
</script>
</body>
