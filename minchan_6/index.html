<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>스틱맨 전투 디펜스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* touch-action 은 **상속되지 않는다.** html,body 에만 걸면 조상 교집합
   규칙에 기대야 하는데 iOS 에서 미덥지 않다. 요소마다 명시한다.
   manipulation = 스크롤·핀치는 두고 **더블탭 확대만** 뺀다.
   캔버스는 아래 type 선택자가 이겨 none 을 유지한다(제스처를 우리가 처리). */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation}
:root{--paper:#e9eef2;--ink:#1b2430;--ally:#1f5fd0;--foe:#c9302c;--slate:#131a22;--slate2:#1e2833;--line:#33414f;--gold:#e8b23a;
  /* 내 색 · 상대 색. 빨강을 잡으면 자바스크립트가 이 둘을 맞바꾼다.
     HUD 가 늘 파랑을 "아군" 으로 칠하면, 자기 병사는 빨간데 화면은 파랑을
     가리키는 꼴이 된다 — 어느 편인지 알 수 없게 만드는 것이 바로 이것이었다. */
  --me:#1f5fd0; --op:#c9302c}
html,body{height:100%;overflow:hidden;background:var(--slate);
  font-family:'Nanum Gothic',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;
  color:#e6edf3;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column}

#top{flex:0 0 auto;background:var(--slate);border-bottom:2px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 7px) 10px 7px;display:flex;align-items:center;gap:10px}
/* 런처로 돌아가기. 다른 게임과 같은 자리·같은 문구다.
   화면에 얹지 않고 상단 바 안에 넣는다 — 겹치면 체력바를 가린다. */
#homeBtn{flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  width:34px;height:34px;font-size:17px;text-decoration:none;line-height:1;
  background:var(--slate2);border:2px solid var(--line);border-radius:4px;
  transition:transform .09s}
#homeBtn:active{transform:scale(.94)}
.bars{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.brow{display:flex;align-items:center;gap:7px;font-size:10px;color:#8ea0b2}
.brow .lb{flex:0 0 46px}
/* 이름표에도 색을 준다. 색맹이어도 "내 본진 / 적 본진" 글자가 남는다. */
.brow.mine .lb{color:var(--me);font-weight:800}
.brow.theirs .lb{color:var(--op);font-weight:800}
.bar{flex:1;height:9px;background:#0b1016;border:1.5px solid var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--me);transition:width .18s}
.bar.foe i{background:var(--op)}
/* 전선. 바탕이 적 땅이고 채워진 파랑이 내 땅이다. 본진 체력바와 달리
   "지금 밀고 있는가" 를 한눈에 보여주는 것이 목적이라 눈금을 넣는다. */
/* 바탕은 상대 땅이다. 늘 어두운 빨강으로 두면 빨강을 잡은 사람에게는
   자기 색이 적 땅으로 칠해진다. color-mix 를 못 읽는 브라우저는 앞줄로 떨어진다. */
.bar.line{background:#2a2130;border-color:#4a3238}
.bar.line{background:color-mix(in srgb, var(--op) 42%, #10161c)}
.bar.line i{background:var(--me);filter:saturate(1.15)}
.bar.line b{position:absolute;left:0;top:0;bottom:0;width:2px;background:#e6edf3;opacity:.5}
.bar.line{position:relative}
.brow .vv{flex:0 0 auto;font-family:'Gaegu',cursive;font-size:14px;font-weight:700;color:#cfdae5;min-width:34px;text-align:right}
#goldbox{flex:0 0 auto;text-align:right;line-height:1.05}
#goldbox .g{font-family:'Gaegu',cursive;font-weight:700;font-size:27px;color:var(--gold)}
#goldbox .s{font-size:10px;color:#7d8fa1}
#goldbox .s b{color:var(--me);font-weight:800}

#stage{flex:1;position:relative;overflow:hidden;background:var(--paper)}
/* touch-action 은 **상속되지 않는다.** body 에 manipulation 을 걸어도
   캔버스는 auto 인 채라, 브라우저가 가로 드래그를 제 스크롤 제스처로
   가로채 pointercancel 을 던진다. 손가락으로는 화면이 밀리지 않는다.
   none 으로 두어 이 캔버스의 제스처는 우리가 처리한다고 못박는다. */
canvas{display:block;width:100%;height:100%;touch-action:none}
#banner{position:absolute;left:0;right:0;top:12px;text-align:center;pointer-events:none}
#banner span{display:inline-block;background:rgba(19,26,34,.9);border:2px solid var(--line);
  padding:4px 14px;font-family:'Gaegu',cursive;font-weight:700;font-size:17px;transform:rotate(-1.2deg)}

#bottom{flex:0 0 auto;background:var(--slate);border-top:2px solid var(--line);
  padding:8px 8px calc(env(safe-area-inset-bottom) + 8px)}
/* 열다섯 칸. 다섯 칸씩 세 줄. 칸을 더 늘리면 폰에서 글자가 뭉개지므로
   줄을 늘렸다. 그만큼 전장이 줄어드는 것은 감수한다. */
#units{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.ubtn{padding:4px 1px 3px}
.ubtn canvas{width:24px;height:28px}
.ubtn{background:var(--slate2);border:2px solid var(--line);border-radius:4px;padding:6px 1px 4px;
  display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;position:relative}
.ubtn:active{transform:translateY(2px)}
.ubtn.off{opacity:.34}
.ubtn.rdy{border-color:#4a6b96}
.ubtn canvas{width:28px;height:32px}
.ubtn .nm{font-size:10px;font-weight:700;color:#d5e0ea;white-space:nowrap}
.ubtn .ct{font-family:'Gaegu',cursive;font-weight:700;font-size:14px;color:var(--gold);line-height:1}
.ubtn .cnt{position:absolute;top:2px;right:4px;font-size:10px;font-weight:800;color:#8fb4e8}
#row2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.wbtn{background:var(--slate2);border:2px solid var(--line);border-radius:4px;padding:9px 6px;
  font-weight:800;font-size:13px;color:#d5e0ea;cursor:pointer;position:relative;overflow:hidden}
.wbtn:active{transform:translateY(2px)}
.wbtn.hot{border-color:var(--gold);color:var(--gold)}
.wbtn .cd{position:absolute;left:0;bottom:0;top:0;background:rgba(255,255,255,.09);width:0%}
.wbtn span{position:relative}

#modal{position:fixed;inset:0;background:rgba(6,10,14,.86);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
#modal.on{display:flex}
.card{background:var(--slate);border:2px solid var(--line);width:100%;max-width:400px;max-height:86vh;overflow:auto;padding:16px}
.card h2{font-family:'Gaegu',cursive;font-size:26px;font-weight:700;margin-bottom:2px}
.card .sub{font-size:11px;color:#7d8fa1;margin-bottom:14px}
.up{display:flex;align-items:center;gap:10px;border-top:1px solid #2a3642;padding:11px 0}
.up .ic{font-size:22px;width:30px;text-align:center}
.up .tx{flex:1;min-width:0}
.up .tx b{display:block;font-size:13px}
.up .tx small{color:#8ea0b2;font-size:11px}
.up button{background:transparent;border:2px solid var(--line);color:var(--gold);font-family:'Gaegu',cursive;
  font-weight:700;font-size:17px;padding:5px 11px;border-radius:3px;cursor:pointer}
.up button:disabled{opacity:.32;color:#8ea0b2}
.close{width:100%;margin-top:15px;background:var(--slate2);border:2px solid var(--line);color:#e6edf3;font-weight:800;padding:11px;font-size:14px;cursor:pointer}

#lobby{position:fixed;inset:0;background:rgba(6,10,14,.96);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;z-index:40;padding:22px;text-align:center}
#lobby.off{display:none}
#lobby h1{font-family:'Gaegu',cursive;font-size:38px;font-weight:700;transform:rotate(-2deg);color:#e8b23a}
#lobby .sub{color:#9db0c2;font-size:13px;margin-bottom:4px}
#lobby button{background:var(--slate2);border:2px solid var(--line);color:#e6edf3;font-weight:800;
  padding:13px 30px;font-size:15px;cursor:pointer;border-radius:5px;min-width:210px}
#lobby button.go{border-color:#4a6b96;color:#bfe6ff}
#lobby .row{display:flex;gap:8px;align-items:center}
#lobby input{background:#0b1016;border:2px solid var(--line);color:#e6edf3;font-weight:800;
  font-size:22px;letter-spacing:6px;text-align:center;width:150px;padding:10px;border-radius:5px;
  text-transform:uppercase;font-family:'Gaegu',cursive}
#rooms{display:flex;flex-direction:column;gap:6px;width:100%;max-width:280px;max-height:168px;overflow-y:auto}
#rooms .rm{display:flex;align-items:center;gap:10px;background:var(--slate2);
  border:2px solid var(--line);border-radius:5px;padding:9px 12px;cursor:pointer;
  color:#e6edf3;font-weight:800;min-width:0}
#rooms .rm:active{transform:translateY(2px)}
#rooms .rm .c{font-family:'Gaegu',cursive;font-size:24px;letter-spacing:5px;color:var(--gold)}
#rooms .rm .w{flex:1;text-align:right;font-size:11px;color:#8ea0b2;font-weight:700}
#rooms .none{color:#6c7d8d;font-size:12px;padding:6px 2px}
#lobbyMsg{color:#8ea0b2;font-size:12px;min-height:18px;max-width:300px;line-height:1.6}
/* 실패는 실패로 보여야 한다. 작은 회색 글씨로 두면 "됐는데 뭔가 이상하다" 가 된다. */
#lobbyMsg.err{color:#e0605c;font-size:13px;font-weight:700}
#lobbyCode{font-family:'Gaegu',cursive;font-size:44px;font-weight:700;letter-spacing:10px;color:#e8b23a}
#over{position:fixed;inset:0;background:rgba(6,10,14,.93);display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;z-index:30;padding:20px;text-align:center}
#over.on{display:flex}
#over h1{font-family:'Gaegu',cursive;font-size:48px;font-weight:700;transform:rotate(-2deg)}
#over p{color:#9db0c2;font-size:14px;margin-bottom:16px}
#over button{background:var(--slate2);border:2px solid var(--line);color:#e6edf3;font-weight:800;padding:13px 34px;font-size:15px;cursor:pointer}
</style>
</head>
<body>
<div id="wrap">
  <div id="top">
    <a id="homeBtn" href="../index.html" title="게임 선택" aria-label="게임 선택">🎮</a>
    <div class="bars">
      <div class="brow mine"><span class="lb">내 본진</span><div class="bar"><i id="barA" style="width:100%"></i></div><span class="vv" id="hpA">1500</span></div>
      <div class="brow theirs"><span class="lb">적 본진</span><div class="bar foe"><i id="barB" style="width:100%"></i></div><span class="vv" id="hpB">4000</span></div>
      <div class="brow"><span class="lb">전선</span><div class="bar line"><i id="barF" style="width:50%"></i><b id="markF"></b></div><span class="vv" id="frontV">–</span></div>
    </div>
    <div id="goldbox"><div class="g" id="gold">0</div><div class="s" id="grate">광부 0</div></div>
  </div>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="banner"><span id="bannerT">전투 개시</span></div>
  </div>

  <div id="bottom">
    <div id="units"></div>
    <div id="row2">
      <button class="wbtn hot" id="ult"><div class="cd" id="ultcd"></div><span>🏹 화살비</span></button>
      <button class="wbtn" id="upBtn"><span>⚒️ 강화</span></button>
    </div>
  </div>
</div>

<div id="modal"><div class="card">
  <h2>강화</h2>
  <div class="sub">골드를 써서 부대와 광산을 키운다.</div>
  <div id="uplist"></div>
  <button class="close" id="closeUp">닫기</button>
</div></div>

<div id="lobby">
  <h1>스틱맨 전투 디펜스</h1>
  <div class="sub">혼자 할까, 친구와 붙을까</div>
  <button id="btnSolo" class="go">혼자 하기</button>
  <button id="btnHost">방 만들기</button>
  <div id="rooms"><div class="none">열린 방을 찾는 중…</div></div>
  <div class="row">
    <input id="joinCode" maxlength="4" placeholder="코드" inputmode="latin" autocomplete="off">
    <button id="btnJoin" style="min-width:96px">참가</button>
  </div>
  <div id="lobbyCode"></div>
  <div id="lobbyMsg"></div>
</div>

<div id="over">
  <h1 id="overT">패배</h1>
  <p id="overS"></p>
  <button id="again">다시 시작</button>
</div>

<script>
(()=>{
'use strict';

/* ============ 설정 ============ */
/**
 * 전장은 **좌우 대칭**이다. 1v1 에서는 양쪽이 같은 조건이어야 하고,
 * 1인 판에서도 적 본진 앞에 광산이 하나 더 서 있을 뿐 달라지는 것은 없다.
 *
 *   |광산A|  |본진A| ..................... |본진B|  |광산B|
 */
const WORLD = 1560;
const MINE_A = 46,  BASE_A = 140;
const MINE_B = WORLD - MINE_A, BASE_B = WORLD - BASE_A;
/** 진영의 본진 x · 광산 x. 좌표를 손으로 뒤집지 않게 한 곳에 둔다. */
function baseX(side){ return side==='a' ? BASE_A : BASE_B; }
function mineX(side){ return side==='a' ? MINE_A : MINE_B; }
/** 이 진영이 나아가는 방향. a 는 오른쪽, b 는 왼쪽. */
function dirOf(side){ return side==='a' ? 1 : -1; }
const MAX_MINERS = 10;
/**
 * 적과 최소한 이만큼은 떨어져 선다 (px).
 *
 * 아군끼리는 겹쳐도 같은 색 무리로 읽히지만, 적과 겹치면 누가 어느 편인지
 * 알 수 없고 전선이라는 것 자체가 사라진다. 서로 통과하지 못하게 막는다.
 *
 * **모든 근접 유닛의 정지 사거리보다 짧아야 한다.** 길면 사거리 밖에서
 * 막혀 서로 노려보기만 한다 — spread 를 이 값에 맞춰 깎는 이유다.
 */
const BODY_GAP = 14;
/**
 * 화살비 재충전 (초).
 *
 * **한 곳에만 적는다.** 발동부와 게이지 두 군데에 26 이 각각 박혀 있어서,
 * 한쪽만 고치면 게이지가 실제 남은 시간과 어긋난 채로 돈다.
 */
const ULT_CD = 14;
/**
 * 1v1 의 본진 체력. **양쪽이 같아야 한다.**
 *
 * 1인 판은 내 본진 1500 · 적 본진 4000 으로 일부러 기울어져 있다 — 버티면서
 * 두꺼운 적 본진을 깎는 판이다. 그 값을 그대로 두면 호스트는 1500, 게스트는
 * 4000 을 들고 붙는다. 대전이 아니라 처형이다.
 *
 * 1인 판의 두 값 사이에서 잡았다. 너무 얇으면 초반 러시 한 번에 끝나고,
 * 4000 이면 광부만 늘리다 한참 뒤에야 싸움이 붙는다.
 */
const DUEL_BASE_HP = 2500;
/**
 * 전장 셋.
 *
 * **판마다 올바른 오프닝이 달라야 판을 나눈 값을 한다.** 적 체력만 올리면
 * 시간 스케일링(foeBoost)과 겹쳐서 그냥 길어지기만 한다 — 이미 시간이
 * 그 일을 하고 있다.
 *
 *   1판  표준. 광부를 굴리고 병력을 섞는 법을 배운다
 *   2판  광맥이 깊어 금이 늦다 + 적 궁수가 많다. 경제냐 방어냐를 고르게 한다
 *   3판  보스가 자주 온다. 화살비를 보스 주기에 맞춰 쓰는 타이밍 싸움
 *
 * `mineT` 는 광부가 한 번 캐는 데 걸리는 시간(초)이다. 이 한 값이
 * 경제 곡선 전체를 바꾼다 — 새 시스템 없이 완전히 다른 판이 된다.
 */
/**
 * 적 편성 — `[병종, 나오기 시작하는 분, 무게]`.
 *
 * 무게 방식으로 적는다. 예전에는 난수 구간(`r<.30`, `r>.74`)을 겹쳐 썼는데,
 * 병종을 하나 더 넣을 때마다 구간을 전부 다시 계산해야 했다.
 *
 * **판마다 새 병종을 하나씩만 푼다.** 한꺼번에 셋을 풀면 무엇 때문에 졌는지
 * 알 수 없다. 1판은 창병까지만, 2판에서 의무병, 3판에서 폭탄병이 더해진다.
 */
const STAGES = [
  { nm:'국경 초소',   gold:200, baseA:1500, baseB:4000, mineT:2.0, bossEvery:50, bossHp:3.2,
    foes:[['sword',0,10],['archer',.6,5],['shield',1.2,4],['spear',2.5,3],['giant',3,1.5]],
    tip:'광부를 먼저 굴려라. 금이 곧 병력이다.' },
  { nm:'깊은 광산',   gold:300, baseA:1500, baseB:5000, mineT:3.6, bossEvery:50, bossHp:3.2,
    foes:[['sword',0,8],['archer',.6,9],['shield',1.2,4],['spear',1.2,4],['medic',2.5,1.5],['giant',3,1.5],
          ['hero',5,.7]],
    tip:'광맥이 깊어 금이 늦다. 적 궁수가 많으니 방패병을 앞에 세워라.' },
  { nm:'무너진 성채', gold:500, baseA:1800, baseB:7500, mineT:2.0, bossEvery:26, bossHp:3.4,
    // **여기서부터 다른 게임이다.** 적이 새 병종 넷을 데리고 나온다.
    ramp:1.9,                       // 시간에 따른 성장이 두 배 가까이 빠르다
    gap:[2.4,.42,.019],             // 처음 2.4초 → 최소 0.42초 간격 (1·2판은 3.2 → .75)
    // 보스는 둘 중 하나다. 같은 얼굴만 오면 세 번째부터는 그냥 큰 숫자가 된다.
    boss:[['berserk',3],['xtitan',2]],
    foes:[['sword',0,6],['archer',.4,5],['spear',.6,4],['shield',.8,4],
          ['giant',1.2,3],['dark',1.2,3],['medic',1.4,1.5],

let uid=0;
function spawn(type, side, m){
  const T = TYPES[type];
  m = m || {hp:1,dmg:1,size:1};
  // 레인은 앞뒤 층이다. 겹쳐서 싸우므로 층이 많을수록 무리로 읽힌다.
  // 7층 × 5px = 위아래 30px. 층을 늘리는 대신 간격을 좁혀, 평지에서
  // 떠 있는 것처럼 보이지 않게 한다.
  // 광부는 가운데(3)에 세워 전투 대열과 섞이지 않게 한다.
  const lane = type==='miner' ? 3 : Math.floor(Math.random()*7);
  G.units.push({
    id:++uid, type, side, T,
    x: baseX(side) + dirOf(side) * (type==='miner' ? -24 : 22),
    hp: T.hp*m.hp, max: T.hp*m.hp,
    dmg: T.dmg*m.dmg, size: T.size*(m.size||1),
    cd:.3, ph:Math.random()*6, sw:0, dead:0, hurt:0, slowT:0, chg:0, combo:0,
    lane: lane, yo: (lane-3)*5,
    // 붙는 거리를 조금씩 달리한다. 전부 같은 지점에 서면 여럿이 겹쳐도
    // 한 사람처럼 보인다 — 이만큼 더 파고들어야 때린다.
    //
    // 세 가지로 깎는다. 30px 상한 · 사거리의 75%(넘기면 원거리 유닛이 적에게
    // 걸어 들어가 근접 유닛이 된다) · **BODY_GAP 여유**(정지 사거리가
    // BODY_GAP 보다 짧아지면 적 앞에서 막힌 채 때리지 못한다).
    spread: Math.max(0, Math.random()*Math.min(30, T.rng*.75, T.rng - BODY_GAP)),
    bounty: side==='b' ? Math.round(T.gain*(.7+(m.hp||1)*.55)) : 0,
    job:'toMine', jobT:0, carry:0
  });
}
/** 이 진영의 살림. 지갑·강화·포탑 시계가 여기 들어 있다. */
function W(side){ return G.side[side]; }
function minerCount(side){
  return G.units.filter(u=>u.type==='miner'&&!u.dead&&u.side===side).length;
}
function haul(side){ return 14 + W(side).up.mine*5; }
function dmgMul(side){ return 1 + W(side).up.dmg*.10; }

/* 시간에 따른 적 강화 */
/**
 * 이번에 나올 적. 지금 시각에 풀린 병종 중에서 무게로 하나 고른다.
 *
 * 아직 아무것도 안 풀렸으면 검사다 — 표를 잘못 적어도 판이 비지는 않는다.
 */
/** 이번 보스. 판이 목록을 주면 무게로 고르고, 없으면 거인이다. */
function pickBoss(){
  const list = stage().boss;
  if(!list || !list.length) return 'giant';
  let total=0; for(const b of list) total+=b[1];
  let r=Math.random()*total;
  for(const b of list){ r-=b[1]; if(r<=0) return b[0]; }
  return list[list.length-1][0];
}

function pickFoe(){
  const m = G.t/60;
  const open = stage().foes.filter(f => m >= f[1]);
  if(!open.length) return 'sword';
  let total = 0;
  for(const f of open) total += f[2];
  let r = Math.random()*total;
  for(const f of open){ r -= f[2]; if(r <= 0) return f[0]; }
  return open[open.length-1][0];
}

/**
 * 시간에 따른 적 성장. 판마다 기울기가 다르다.
 *
 * 1·2판은 배우는 판이라 완만하다. 3판은 `ramp` 로 거의 두 배 빠르게 오른다 —
 * 병종만 바꿔서는 "새 얼굴이 나오는 같은 판" 이 된다.
 */
function foeBoost(){
  const m = G.t/60, k = stage().ramp || 1;
  return {hp:1+m*.55*k, dmg:1+m*.38*k, size:1};
}
/**
 * 이 병종이 실제로 받을 성장 배율.
 *
 * **무거운 것은 절반만 받는다.** 용사·버서커·타이탄은 원래 체력이 크다.
 * 후반 배율(3판 6분 ×7.27)을 그대로 얹으면 타이탄이 4만 체력으로 서서
 * 죽지 않는 벽이 된다 — 어려운 게 아니라 끝나지 않는 판이 된다.
 */
function boostFor(type){
  const b = foeBoost(), T = TYPES[type];
  if(!T || !T.heavy) return b;
  return { hp: 1 + (b.hp-1)*.35, dmg: 1 + (b.dmg-1)*.5, size: 1 };
}

/** 스폰 간격. [처음, 최소, 초당 감소]. 3판은 더 촘촘하다. */
function spawnGap(){
  const g = stage().gap || [3.2,.75,.013];
  return Math.max(g[1], g[0] - G.t*g[2]);
}
function threat(){ return 1 + Math.floor(G.t/45); }

/* ============ 루프 ============ */
function step(dt){
  if(G.over) return;
  _dt = dt;
  G.t += dt;
  W('a').gold += 1.2*dt;
  W('b').gold += 1.2*dt;

  /* 적 무한 진격 */
  G.spawnT -= dt;
  if(G.spawnT<=0){
    G.spawnT = spawnGap();
    // 1v1 에서는 빨강을 사람이 돌린다. AI 까지 나오면 둘을 동시에 상대한다.
    if(!(net.on && net.ready)){
      const t = pickFoe();
      spawn(t, 'b', boostFor(t));
      // 아주 드물게 오는 것은 알려 준다. 쏟아지는 틈에 조용히 끼면 못 본다.
      if(t==='xtitan'){ banner('감염된 타이탄 접근'); G.shake=.35; beep(120,.5,.07); }
    }
  }
  G.bossT -= dt;
  if(G.bossT<=0 && !(net.on && net.ready)){
    G.bossT = stage().bossEvery;
    const bt = pickBoss();
    // **무거운 보스에는 보스 배율을 얹지 않는다.** 이미 체력이 크다 —
    // 3.4 를 곱하면 6분에 14만짜리가 26초마다 서고, 그건 어려운 게 아니라
    // 끝나지 않는 판이다. 보스 배율은 거인처럼 가벼운 것에만 쓴다.
    const hb = boostFor(bt), heavy = TYPES[bt].heavy;
    spawn(bt,'b',{ hp: hb.hp*(heavy?1:stage().bossHp),
                   dmg: hb.dmg*(heavy?1.15:1.5), size: heavy?1.1:1.35 });
    banner(bt==='giant' ? '보스 출현' : TYPES[bt].nm+' 출현');
    beep(150,.3,.06);
  }

  /* 본진 포탑 */
  for(const sd of ['a','b']){
    const w = W(sd);
    if(w.up.turret<=0) continue;
    w.turretT -= dt;
    if(w.turretT>0) continue;
    // 내 본진 쪽 340px 안에 들어온 적 중 가장 가까운 것.
    const bx = baseX(sd), d = dirOf(sd);
    const tgt = G.units
      .filter(u=>u.side!==sd && !u.dead && u.type!=='miner' && (u.x-bx)*d < 340 && (u.x-bx)*d > 0)
      .sort((p,q)=>(p.x-bx)*d - (q.x-bx)*d)[0];
    if(tgt){ shoot(bx+d*8, gy-108, tgt, 12+w.up.turret*8, sd); w.turretT = Math.max(.45, 1.5-w.up.turret*.12); }
    else w.turretT = .25;
  }

  const us = G.units;
  for(const u of us){
    if(u.dead){ u.dead += dt; continue; }
    u.hurt = Math.max(0, u.hurt-dt);
    if(u.slowT>0) u.slowT -= dt;
    if(u.ward>0) u.ward -= dt;

    /* --- 광부 --- */
    if(u.type==='miner'){
      if(u.job==='toMine'){
        if((mineX(u.side)-u.x)*dirOf(u.side) < -6){ u.x -= dirOf(u.side)*spdOf(u)*dt; u.ph += dt*9; }
        else { u.job='mining'; u.jobT=stage().mineT; }
      } else if(u.job==='mining'){
        u.jobT -= dt;
        u.sw = (Math.sin(G.t*11+u.id)+1)/2;
        if(Math.random()<dt*9) puff(mineX(u.side)+dirOf(u.side)*16, gy-30, '#e8b23a', 2);
        if(u.jobT<=0){ u.job='toBase'; u.carry=haul(u.side); }
      } else {
        if((baseX(u.side)-u.x)*dirOf(u.side) > 22){ u.x += dirOf(u.side)*spdOf(u)*dt; u.ph += dt*9; }
        else {
          W(u.side).gold += u.carry; W(u.side).mined += u.carry;
          float(u.x, gy-70, '+'+u.carry, '#c98f1a', 1.0);
          beep(880,.05,.02);
          u.carry=0; u.job='toMine';
        }
      }
      continue;
    }

    const dir = u.side==='a' ? 1 : -1;

    /* 사령술사 — 해골병을 불러내고, 전선 뒤에 선다 */
    if(u.T.summon){
      u.cd -= dt;
      if(u.cd<=0){
        u.cd = u.T.atk; u.sw = 1;
        for(let i=0;i<2;i++) spawn('bone', u.side, foeBoost());
        // 방금 만든 둘을 술사 옆으로 당긴다. 본진에서 걸어오면 소환이 아니다.
        const n=G.units.length;
        if(n>=2){ G.units[n-1].x = u.x - dir*14; G.units[n-2].x = u.x + dir*10; }
        for(let i=0;i<8;i++) G.parts.push({x:u.x+(Math.random()-.5)*30, y:gy-20,
          vx:0, vy:-90-Math.random()*70, life:.6, c:'#9a5fd0', s:3});
        float(u.x, gy-u.size-10+u.yo, '소환', '#9a5fd0', .9);
        beep(210,.18,.04);
      }
      standBehind(u, dir, 90, o=>!o.T.summon);
      u.sw=Math.max(0,u.sw-dt*3.4);
      continue;
    }

    /* 사제 — 가장 많이 다친 아군 하나를 크게 고친다 */
    if(u.T.healer){
      let worst=null, wd=1e9;
      for(const o of us){
        if(o.side!==u.side||o.dead||o.type==='miner'||o.hp>=o.max) continue;
        const d=Math.abs(o.x-u.x); if(d<wd){ wd=d; worst=o; }
      }
      if(worst && wd<=u.T.rng){
        u.cd-=dt;
        if(u.cd<=0){
          u.cd=u.T.atk; u.sw=1;
          worst.hp=Math.min(worst.max, worst.hp+u.T.heal);
          float(worst.x, gy-worst.size-6+worst.yo, '+'+u.T.heal, '#3fa96b', .8);
          for(let i=0;i<4;i++) G.parts.push({x:worst.x+(Math.random()-.5)*18,
            y:gy-worst.size*.5+worst.yo, vx:0, vy:-70-Math.random()*50, life:.5, c:'#5fd39b', s:3});
          beep(980,.09,.025);
        }
      } else standBehind(u, dir, 70, o=>!o.T.healer);
      u.sw=Math.max(0,u.sw-dt*3.4);
      continue;
    }

    let tgt=null, td=1e9, best=1e9;
    for(const o of us){
      // 광부는 겨누지 않는다. 무적인 것을 표적으로 잡으면 그 앞에 서서
      // 영원히 헛손질만 하고 전선이 멈춘다.
      if(o.side===u.side || o.dead || o.type==='miner') continue;
      const d = Math.abs(o.x-u.x);
      const sc = d + Math.abs(o.lane-u.lane)*16;
      if(sc<best && (o.x-u.x)*dir > -40){ best=sc; td=d; tgt=o; }
    }
    const base = u.side==='a' ? G.baseB : G.baseA;
    const bd = Math.abs(base.x - u.x);
    if(bd < td){ tgt = base; td = bd; }

    const reach = u.T.rng - u.spread;
    if(td <= reach){
      u.cd -= dt;
      if(u.cd<=0){
        u.cd = u.T.atk; u.sw = 1;
        let dam = u.dmg * dmgMul(u.side);

        // 로마 기병 — 달려온 만큼이 첫 타에 실린다. 멈춰 서면 그냥 검사다.
        if(u.T.charge && u.chg>1.1){
          dam *= 2.6;
          ring(tgt.x, gy-(tgt.size||60)*.55+(tgt.yo||0), '#f0d27a', 9, .3);
          puff(tgt.x, gy-(tgt.size||60)*.5+(tgt.yo||0), '#f0d27a', 8);
          beep(240,.16,.055);
        }
        u.chg = 0;

        if(u.T.suicide){ blowUp(u, dam, dir); }
        else if(u.T.titan){ titanCombo(u, dam, dir); }
        else if(u.T.slam){ slamHit(u, dam, dir); }
        else if(u.T.beam){ beamHit(u, dam, dir); }
        else if(u.T.medic){
          // 때리지 않고 고친다. 자기 자신도 포함이다 — 앞에 나선 의무병이
          // 혼자 죽어 나가면 쓸 이유가 없다.
          let n=0;
          for(const o of us){
            if(o.side!==u.side||o.dead||o.type==='miner') continue;
            if(o.hp>=o.max) continue;
            if(Math.abs(o.x-u.x) > u.T.healRng) continue;
            o.hp = Math.min(o.max, o.hp + u.T.heal); n++;
          }
          if(n) float(u.x, gy-u.size-6+u.yo, '+'+u.T.heal, '#7fd39b', .6);
        }
        else if(u.T.chain) castChain(u, tgt, dam);
        else if(u.T.ranged) shoot(u.x+dir*10, gy-u.size*.66+u.yo, tgt, dam, u.side, u.T.splash, u.T.slow);
        else if(u.T.pierce){
          // **앞쪽만** 꿴다. 거인의 광역은 양옆이지만 창은 방향이 있다.
          for(const o of us){
            if(o.side===u.side||o.dead) continue;
            const fwd=(o.x-u.x)*dir;
            if(fwd>-6 && fwd<=u.T.rng+6) hit(o, dam, o.x);
          }
          // 본진은 유닛 목록에 없다. 따로 찌르지 않으면 창병 앞에서
          // 본진이 멀쩡하다 — 때리는 시늉만 하고 체력이 안 준다.
          const bf=(base.x-u.x)*dir;
          if(bf>-6 && bf<=u.T.rng+6) hit(base, dam, base.x);
        }
        else if(u.type==='giant'){
          for(const o of us){
            if(o.side===u.side||o.dead) continue;
            if(Math.abs(o.x-u.x) <= u.T.rng+6) hit(o, dam, o.x);
          }
          if(Math.abs(base.x-u.x) <= u.T.rng+6) hit(base, dam, base.x);
        }
        else hit(tgt, dam, u.x+dir*u.T.rng*.8);
        // 암흑기사 — 준 만큼 회복한다. 오래 끌수록 이쪽이 손해다.
        if(u.T.drain && !u.dead){
          const heal = Math.round(dam*u.T.drain);
          u.hp = Math.min(u.max, u.hp + heal);
          float(u.x, gy-u.size-8+u.yo, '+'+heal, '#9a5fd0', .6);
        }
        beep(u.T.chain?1180:(u.T.medic?740:(u.T.ranged?520:190)),.05,.05);
      }
    }

    // **때리는 것과 걷는 것은 따로다.**
    //
    // 예전에는 if/else 라, 사거리 안에 들어오면 무조건 멈췄다. 타이탄은
    // 사거리가 520 이라 한참 밖에서 서 버려 `stand:150` 이 죽은 값이 됐다.
    // 얼마나 다가갈지는 stand 가 정하고, 없으면 사거리까지다.
    if(td > (u.T.stand || reach)){
      // **아군끼리는 막지 않는다.** 예전에는 같은 레인 앞 22px 안에 아군이
      // 있으면 멈춰서, 한 줄로 서고 맨 앞 하나만 싸웠다. 뒤의 열 명은
      // 구경만 한다 — 병력을 모으는 재미가 거기서 죽는다.
      // 이제는 그대로 파고들어 겹쳐 싸운다.
      //
      // **적군은 뚫고 지나가지 못한다.** 통과하면 두 부대가 한 자리에 섞여
      // 누가 어느 편인지 읽히지 않고, 전선이라는 것이 사라진다.
      // 레인은 보지 않는다 — 위아래 30px 차이는 겹쳐 보이는 거리다.
      // 광부는 빼놓는다. 일하러 다니는 인부가 벽이 되면 안 된다.
      let blocked=false;
      for(const o of us){
        if(o.dead||o.side===u.side||o.type==='miner') continue;
        const gap=(o.x-u.x)*dir;
        if(gap>0 && gap<BODY_GAP){ blocked=true; break; }
      }
      if(!blocked){ u.x += dir*spdOf(u)*dt; u.ph += dt*9; u.chg += dt; }
    }
    u.sw = Math.max(0, u.sw - dt*3.4);
  }

  for(const s of G.shots){
    s.t += dt;
    const k = s.t/s.dur;
    s.x = s.x0 + (s.tx-s.x0)*k;
    s.y = s.y0 + (s.ty-s.y0)*k - Math.sin(Math.PI*k)*38;
    if(k>=1){
      s.done=1;
      if(s.splash){
        // 떨어진 자리를 친다. 겨눈 적이 이미 죽었어도 폭발은 일어난다.
        for(const o of G.units){
          if(o.side===s.side||o.dead) continue;
          if(Math.abs(o.x-s.x) > s.splash) continue;
          hit(o, s.dmg, s.x);
          if(s.slow) o.slowT = s.slow;   // 얼린다
        }
        // 본진도 폭발 범위 안이면 맞는다. 유닛 목록에만 물으면 본진 앞에
        // 떨어진 폭탄이 아무 일도 하지 않는다.
        const bs = s.side==='a' ? G.baseB : G.baseA;
        if(Math.abs(bs.x - s.x) <= s.splash) hit(bs, s.dmg, s.x);
        puff(s.x,s.y, s.slow?'#9fe0ff':'#e8b23a', s.slow?16:12);
      }
      else if(s.tgt && !s.tgt.dead) hit(s.tgt, s.dmg, s.x);
      puff(s.x,s.y,'#1b2430',4);
    }
  }
  G.shots = G.shots.filter(s=>!s.done);

  for(const r of G.rain){
    r.t -= dt; r.tick -= dt;
    if(r.tick<=0){
      r.tick=.12;
      // 화살은 **보이는 화면 전체**에 떨어뜨린다. 월드 전체(1560px)에 같은
      // 수를 뿌리면 화면에서는 드문드문 보인다. 개수를 화면 폭에 맞춰
      // 늘려 예전 밀도(113px 당 하나)를 그대로 유지한다.
      const n = Math.max(3, Math.round(VIEW/113));
      for(let i=0;i<n;i++) G.parts.push({x:cam+Math.random()*VIEW, y:gy-260, vx:0, vy:640, life:.42, c:'#1b2430', s:9, arrow:1});
      // 피해는 자리를 가리지 않는다. 화면 밖의 적도 맞는다.
      //
      // **광부는 뺀다.** 전 영역으로 바꾼 뒤로 화살비 한 번이 상대 광산까지
      // 닿아, 싸움이 아니라 상대 경제를 지우는 버튼이 됐다. 광부는 무기가
      // 없고 전선에도 오지 않는다 — 때릴 이유가 없다.
      const rs = r.side || 'a';
      for(const u of G.units){
        if(u.side===rs || u.dead || u.type==='miner') continue;
        hit(u, 16*dmgMul(rs), u.x);
      }
    }
    if(r.t<=0) r.done=1;
  }
  G.rain = G.rain.filter(r=>!r.done);
  for(const sd of ['a','b']) if(W(sd).rainCd>0) W(sd).rainCd -= dt;

  for(const p of G.parts){
    p.life -= dt; p.x += p.vx*dt; p.y += p.vy*dt;
    if(!p.arrow && !p.ring) p.vy += 520*dt;
    if(!p.ring && p.y>gy){ p.y=gy; p.life=Math.min(p.life,.1); }
  }
  G.parts = G.parts.filter(p=>p.life>0);
  for(const b of G.bolts) b.t -= dt;
  G.bolts = G.bolts.filter(b=>b.t>0);
  for(const b of G.beams) b.life -= dt;
  G.beams = G.beams.filter(b=>b.life>0);
  if(G.shake>0) G.shake = Math.max(0, G.shake - dt*2.2);
  for(const t of G.texts){ t.life-=dt; t.y -= 34*dt; }
  G.texts = G.texts.filter(t=>t.life>0);
  G.units = G.units.filter(u=>u.dead < 1.3);

  const foesAlive = G.units.filter(u=>u.side==='b'&&!u.dead);
  let front = foesAlive.length ? Math.min(...foesAlive.map(u=>u.x)) : BASE_B-200;
  const allies = G.units.filter(u=>u.side==='a'&&!u.dead&&u.type!=='miner');

  // 지표용 전선 — 양쪽 선두의 한가운데다. 한쪽이 비면 그쪽 본진을 선두로 친다.
  // 아무도 없으면 직전 값을 그대로 둬서 막대가 튀지 않는다.
  const tipA = allies.length ? Math.max(...allies.map(u=>u.x)) : BASE_A;
  const tipB = foesAlive.length ? Math.min(...foesAlive.map(u=>u.x)) : BASE_B;
  G.front = (tipA + tipB)/2;

  if(allies.length) front = (front + Math.max(...allies.map(u=>u.x)))/2;
  const want = clamp(front - VIEW*.5, 0, WORLD-VIEW);
  if(camUser>0) camUser -= dt; else cam += (want-cam)*Math.min(1, dt*2.4);

  if(myBase().hp<=0) finish(false);
  if(foeBase().hp<=0) finish(true);
}

function hit(t,d,at){
  if(t.T){
    if(t.dead) return;
    // **광부는 무적이다.** 무기도 없고 전선에도 오지 않는다. 광역기가
    // 스치기만 해도 경제가 통째로 날아가면, 싸우는 게 아니라 서로의
    // 광산을 지우는 게임이 된다.
    if(t.type==='miner'){
      // 무적인 건 맞다. 다만 아무 반응이 없으면 화면에서는 '쓸려나간 것'과
      // 구분이 안 된다. 타이탄 레이저가 광부를 지나갈 때 튕겨냈다는 걸 보여준다.
      t.ward = .5;
      puff(t.x, gy-t.size*.7+t.yo, '#bfe6ff', 3);
      return;
    }
    t.hp -= d; t.hurt=.12;
    float(t.x, gy-t.size-6+t.yo, Math.round(d), t.side==='a'?'#c9302c':'#1b2430', .55);
    puff(at||t.x, gy-t.size*.6+t.yo, t.side==='a'?'#1f5fd0':'#c9302c', 5);
    if(t.hp<=0){
      t.dead=.001; t.hp=0;
      if(t.side==='b'){
        W('a').gold += t.bounty; G.kills++; G.loot += t.bounty;
        float(t.x, gy-t.size-18+t.yo, '+'+t.bounty+'G', '#c98f1a', 1.1);
        for(let i=0;i<4;i++) G.parts.push({x:t.x,y:gy-t.size*.6+t.yo,
          vx:(Math.random()-.5)*140, vy:-Math.random()*190-60, life:.55, c:'#e8b23a', s:3});
        beep(1040,.07,.03);
      }
      beep(120,.14,.06);
    }
  } else {
    t.hp = Math.max(0, t.hp-d);
    puff(t.x + (t===G.baseA?26:-26), gy-70, '#6b7785', 6);
  }
}
function shoot(x,y,tgt,dmg,side,splash,slow){
  const tx=tgt.x, ty=tgt.T?gy-tgt.size*.6+tgt.yo:gy-70;
  const dist=Math.hypot(tx-x,ty-y);
  G.shots.push({x0:x,y0:y,x,y,tx,ty,tgt,dmg,side,splash,slow,t:0,dur:Math.max(.22,dist/620)});
}

/** 전선 뒤 `back` px 에 자리를 잡는다. 사제·사령술사가 쓴다. */
function standBehind(u, dir, back, keep){
  let front=null, fd=1e9;
  for(const o of G.units){
    if(o.side!==u.side||o.dead||o.type==='miner'||!keep(o)) continue;
    const d=Math.abs(o.x-u.x); if(d<fd){ fd=d; front=o; }
  }
  const goal = front ? front.x - dir*back : baseX(u.side) + dir*90;
  if(Math.abs(goal-u.x)>6){ u.x += Math.sign(goal-u.x)*spdOf(u)*dt0(); u.ph += dt0()*9; }
}
/** 이 틱의 dt. 능력 함수들이 루프 밖에 있어 한 곳에서 받아 둔다. */
let _dt = 1/60;
function dt0(){ return _dt; }

/** 자폭 — 반경 안을 터뜨리고 자기도 죽는다. 절반 밖은 60%만 받는다. */
function blowUp(u, dam, dir){
  const R=u.T.suicide;
  for(const o of G.units){
    if(o.side===u.side||o.dead) continue;
    const d=Math.abs(o.x-u.x);
    if(d < R) hit(o, dam*(d<R*.5?1:.6), o.x);
  }
  const b = u.side==='a' ? G.baseB : G.baseA;
  if(b.hp>0 && Math.abs(b.x-u.x) < R+30) hit(b, dam*.8, b.x);
  ring(u.x, gy-u.size*.4+u.yo, '#e8724a', R*.85, .4);
  ring(u.x, gy-u.size*.4+u.yo, '#ffd77a', R*.5, .28);
  puff(u.x, gy-u.size*.4+u.yo, '#e8894a', 22);
  G.shake=.3; u.hp=0; u.dead=.001;
  beep(90,.3,.07);
}

/** 앞쪽 직선을 훑는다. 광역 능력들이 공유한다. */
/**
 * 앞쪽 직선을 훑는다. 광역 능력들이 공유한다.
 *
 * `noBase` 를 주면 본진은 건드리지 않는다 — 사거리가 아주 긴 기술이
 * 전선을 지나지 않고 성만 깎는 것을 막을 때 쓴다.
 */
function lineHit(u, dir, reach, dam, nearMul, nearAt, noBase){
  for(const o of G.units){
    if(o.side===u.side||o.dead) continue;
    const off=(o.x-u.x)*dir;
    if(off > -40 && off < reach) hit(o, dam*(nearAt && off<nearAt ? nearMul : (nearAt?0.7:1)), o.x);
  }
  if(noBase) return;
  const b = u.side==='a' ? G.baseB : G.baseA;
  const boff=(b.x-u.x)*dir;
  if(b.hp>0 && boff > -40 && boff < reach) hit(b, dam*(nearAt && boff<nearAt ? nearMul : (nearAt?0.7:1)), b.x);
}

/** 버서커 내려찍기 — 사거리 밖까지 닿지만 먼 쪽은 약하다. */
function slamHit(u, dam, dir){
  lineHit(u, dir, u.T.rng + u.T.slam, dam, 1, u.T.rng);
  ring(u.x+dir*(u.T.rng*.7), gy-6, '#4a5568', u.T.slam*.8, .42);
  ring(u.x+dir*(u.T.rng*.7), gy-6, '#c9a0a0', u.T.slam*.5, .3);
  puff(u.x+dir*u.T.rng*.8, gy-14, '#8a94a3', 16);
  G.shake=.38; beep(80,.32,.075);
}

/** 용사 검기 — 직선을 관통한다. */
function beamHit(u, dam, dir){
  lineHit(u, dir, u.T.rng, dam);
  G.beams.push({x1:u.x, x2:u.x+dir*u.T.rng, y:gy-u.size*.55+u.yo, life:.3, max:.3});
  G.shake=.12; beep(1180,.16,.05);
}

/**
 * 타이탄 — 세 동작을 돌아가며 쓴다.
 *
 * 같은 것만 반복하면 큰 유닛이 아니라 큰 숫자가 된다. 사거리와 배율을
 * 서로 다르게 두어, 지금 어느 동작인지가 화면에서 읽히게 한다.
 */
function titanCombo(u, dam, dir){
  const stage = (u.combo|0) % 3;
  u.combo = (u.combo|0) + 1;
  u.lastStage = stage;          // 그림이 지금 어느 동작인지 알아야 한다

  // **1v1 에서는 레이저(520)와 코어 빔(780)이 성을 깎지 않는다.**
  //
  // 사거리가 전장의 절반을 넘어서, 타이탄 하나를 세워 두면 전선을 만들지
  // 않고 상대 성만 녹인다. 사람이 상대일 때는 그게 싸움이 아니라 봉쇄다.
  // 대검(230)은 전선까지 걸어와야 닿으므로 그대로 둔다.
  const duel = net.on && net.ready;

  if(stage===0){
    lineHit(u, dir, 520, dam*.75, undefined, undefined, duel);
    G.beams.push({x1:u.x+dir*u.size*.28, x2:u.x+dir*520, y:gy-u.size*.60+u.yo,
      life:.26, max:.26, c1:'rgba(255,90,70,.45)', c2:'#ffd9c8', w:16});
    G.shake=.14; beep(1400,.16,.05);
  } else if(stage===1){
    lineHit(u, dir, 230, dam*1.45);
    ring(u.x+dir*140, gy-8, '#4a5568', 170, .42);
    ring(u.x+dir*140, gy-8, '#dfe8f0', 130, .36);
    puff(u.x+dir*150, gy-16, '#8a94a3', 26);
    G.shake=.45; beep(70,.4,.085);
  } else {
    lineHit(u, dir, 780, dam*2.1, undefined, undefined, duel);
    G.beams.push({x1:u.x, x2:u.x+dir*780, y:gy-u.size*.52+u.yo,
      life:.55, max:.55, c1:'rgba(120,240,255,.5)', c2:'#f2ffff', w:70});
    G.beams.push({x1:u.x, x2:u.x+dir*780, y:gy-u.size*.52+u.yo,
      life:.55, max:.55, c1:'rgba(90,160,255,.35)', c2:'#bfe9ff', w:120});
    G.shake=.45; beep(220,.6,.08);
    float(u.x+dir*200, gy-u.size*.75+u.yo, '코어 빔', '#8ff0ff', 1.3);
  }
}

/** 지금 낼 수 있는 속도. 얼어 있으면 절반이다. */
function spdOf(u){ return u.T.spd * (u.slowT>0 ? .5 : 1); }

/**
 * 연쇄 번개.
 *
 * 겨눈 적에서 가까운 적으로 튄다. 이미 맞은 적에게는 다시 튀지 않는다 —
 * 안 그러면 둘 사이를 오가며 같은 둘만 네 번 때린다.
 *
 * 자국(`G.bolts`)은 **칠 때 한 번만** 지그재그를 만들어 저장한다. 매 프레임
 * 새로 흔들면 번개가 부들부들 떠는 그림이 된다.
 */
function castChain(u, first, dam){
  const yOf = o => o.T ? gy - o.size*.55 + o.yo : gy - 70;
  const nodes = [{x:u.x, y:gy - u.size*.72 + u.yo}];
  const struck = new Set();
  let cur = first, d = dam;

  for(let i=0; i<u.T.chain && cur; i++){
    struck.add(cur);
    nodes.push({x:cur.x, y:yOf(cur)});
    hit(cur, d, cur.x);
    puff(cur.x, yOf(cur), '#bfe6ff', 7);
    d *= .8;

    let next=null, best=1e9;
    for(const o of G.units){
      if(o.side===u.side || o.dead || struck.has(o)) continue;
      const dd = Math.abs(o.x - cur.x);
      if(dd <= u.T.chainRng && dd < best){ best=dd; next=o; }
    }
    cur = next;
  }
  if(nodes.length > 1) G.bolts.push({path: jagged(nodes), t:.30, max:.30});
}

/** 마디 사이를 지그재그로 쪼갠다. 끝점은 흔들지 않는다 — 대상에서 어긋난다. */
function jagged(nodes){
  const out=[nodes[0]];
  for(let i=0;i<nodes.length-1;i++){
    const a=nodes[i], b=nodes[i+1], seg=5;
    for(let k=1;k<=seg;k++){
      const t=k/seg, last=(k===seg);
      out.push({
        x: a.x+(b.x-a.x)*t + (last?0:(Math.random()-.5)*15),
        y: a.y+(b.y-a.y)*t + (last?0:(Math.random()-.5)*15),
      });
    }
  }
  return out;
}
/** 퍼지는 고리 하나. 내려찍기·폭발의 범위를 눈으로 보여준다. */
function ring(x,y,c,size,life){ G.parts.push({x,y,vx:0,vy:0,life,max:life,c,s:size,ring:1}); }
function puff(x,y,c,n){
  for(let i=0;i<n;i++) G.parts.push({x,y,vx:(Math.random()-.5)*130,vy:-Math.random()*150-30,life:.35+Math.random()*.25,c,s:2+Math.random()*2});
}
function float(x,y,txt,c,life){ G.texts.push({x,y,txt:String(txt),c,life,max:life}); }

function finish(win){
  if(G.over && overShown) return;
  G.over = true; overShown = true;
  const duel = net.on && net.ready;
  const last = stageIx >= STAGES.length-1;
  const h=document.getElementById('overT');
  h.textContent = duel ? (win ? '승리' : '패배')
                       : (win ? (last ? '전역 완료' : (stageIx+1)+'판 돌파') : '본진 함락');
  h.style.color = win ? '#7fd39b' : '#e0605c';

  const stats = '생존 ' + fmt(G.t) + ' · 처치 ' + G.kills + '명 · 채굴 ' + Math.round(W(ME).mined) + 'G · 전리품 ' + G.loot + 'G';
  let note = '';
  if(duel) note = win ? '상대 본진을 무너뜨렸다.' : '본진이 무너졌다.';
  else if(win && !last) note = '다음 전장 — ' + STAGES[stageIx+1].nm + '. ' + STAGES[stageIx+1].tip;
  else if(win) note = '세 전장을 모두 넘었다.';
  else note = STAGES[stageIx].tip;
  document.getElementById('overS').innerHTML = stats + '<br>' + note;

  document.getElementById('again').textContent =
    duel ? '로비로' : (win ? (last ? '처음부터' : '다음 전장 ▶') : '다시 시작');
  document.getElementById('over').classList.add('on');
}
function fmt(s){ const m=Math.floor(s/60), r=Math.floor(s%60); return m+'분 '+(r<10?'0':'')+r+'초'; }

/* ============ 그리기 ============ */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
function resize(){
  const r=cv.getBoundingClientRect();
  dpr=Math.min(devicePixelRatio||1,2);
  cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr);
  cw=r.width; ch=r.height;
  VIEW = cw<560 ? 600 : 940;
  scale = cw/VIEW;
  gy = ch/scale - 26;
}
addEventListener('resize', resize);

function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cw,ch);
  ctx.fillStyle='#e9eef2'; ctx.fillRect(0,0,cw,ch);
  // 큰 한 방은 화면이 흔들려야 무게가 산다. 카메라 변환에 얹는다.
  const sh = G.shake>0 ? G.shake*9 : 0;
  const shx = sh ? (Math.random()-.5)*sh : 0, shy = sh ? (Math.random()-.5)*sh : 0;
  ctx.setTransform(dpr*scale,0,0,dpr*scale,(-cam+shx)*scale*dpr, shy*scale*dpr);
  const L=cam, R=cam+VIEW, bot=ch/scale;

  ctx.strokeStyle='#d3dee6'; ctx.lineWidth=1;
  const gsz=34; ctx.beginPath();
  for(let x=Math.floor(L/gsz)*gsz;x<R+gsz;x+=gsz){ ctx.moveTo(x,0); ctx.lineTo(x,bot); }
  for(let y=0;y<bot;y+=gsz){ ctx.moveTo(L,y); ctx.lineTo(R,y); }
  ctx.stroke();

  ctx.fillStyle='#d5dfe7'; ctx.beginPath(); ctx.moveTo(L,gy);
  for(let x=L-100;x<R+100;x+=44) ctx.lineTo(x, gy-46-Math.sin(x*.004)*26-Math.sin(x*.011)*11);
  ctx.lineTo(R,gy); ctx.closePath(); ctx.fill();

  ctx.strokeStyle='#1b2430'; ctx.lineWidth=2.4; ctx.beginPath();
  for(let x=L-10;x<R+10;x+=9) ctx.lineTo(x, gy+Math.sin(x*.9)*.8);
  ctx.stroke();
  ctx.fillStyle='#dbe3ea'; ctx.fillRect(L-10,gy,VIEW+20,bot-gy);
  ctx.strokeStyle='#c2ced8'; ctx.lineWidth=1.4; ctx.beginPath();
  for(let x=Math.floor(L/26)*26;x<R+26;x+=26){ ctx.moveTo(x,gy+5); ctx.lineTo(x-9,gy+16); }
  ctx.stroke();

  drawMine('a'); drawMine('b');
  drawBase(G.baseA,'a');
  drawBase(G.baseB,'b');
  for(const u of [...G.units].sort((a,b)=>(a.yo-b.yo)||(a.size-b.size))) drawUnit(u);

  /* 검기·레이저. 굵은 겉선 위에 밝은 심을 겹친다 */
  for(const b of G.beams){
    const a = b.life/b.max;
    ctx.globalAlpha = a;
    ctx.lineCap='round';
    ctx.lineWidth=(b.w||22); ctx.strokeStyle=b.c1||'rgba(150,210,255,.4)';
    ctx.beginPath(); ctx.moveTo(b.x1,b.y); ctx.lineTo(b.x2,b.y); ctx.stroke();
    ctx.lineWidth=(b.w||22)*.32; ctx.strokeStyle=b.c2||'#ffffff';
    ctx.beginPath(); ctx.moveTo(b.x1,b.y); ctx.lineTo(b.x2,b.y); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  /* 연쇄 번개. 굵은 하늘빛 위에 흰 심을 겹쳐 빛나 보이게 한다 */
  for(const b of G.bolts){
    const a = b.t/b.max;
    ctx.globalAlpha = a;
    ctx.lineCap='round'; ctx.lineJoin='round';
    for(const pass of [[7.5,'#5fb8ff'],[3.4,'#bfe6ff'],[1.4,'#ffffff']]){
      ctx.lineWidth=pass[0]; ctx.strokeStyle=pass[1];
      ctx.beginPath();
      b.path.forEach((q,i)=> i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  ctx.lineWidth=2.2; ctx.strokeStyle='#1b2430';
  for(const s of G.shots){
    const ang=Math.atan2(s.ty-s.y0,s.tx-s.x0)+(s.t/s.dur-.5)*.9*(s.tx>s.x0?1:-1);
    ctx.save(); ctx.translate(s.x,s.y); ctx.rotate(ang);
    ctx.beginPath(); ctx.moveTo(-9,0); ctx.lineTo(9,0);
    ctx.moveTo(9,0); ctx.lineTo(4,-3); ctx.moveTo(9,0); ctx.lineTo(4,3); ctx.stroke();
    ctx.restore();
  }
  for(const p of G.parts){
    ctx.globalAlpha=Math.max(0,Math.min(1,p.life*3));
    if(p.arrow){ ctx.strokeStyle=p.c; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(p.x,p.y-p.s); ctx.lineTo(p.x,p.y+p.s); ctx.stroke(); }
    else if(p.ring){
      // 퍼지는 고리. 충격이 어디까지 닿았는지를 크기로 말한다.
      const k = 1 - p.life/p.max;
      ctx.strokeStyle=p.c; ctx.lineWidth=3;
      ctx.beginPath(); ctx.ellipse(p.x, p.y, p.s*(.35+k*.75), p.s*(.16+k*.3), 0, 0, 7); ctx.stroke();
    }
    else { ctx.fillStyle=p.c; ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s); }
  }
  ctx.globalAlpha=1;
  ctx.textAlign='center'; ctx.font='700 17px Gaegu, sans-serif';
  for(const t of G.texts){ ctx.globalAlpha=Math.min(1,t.life/t.max*1.7); ctx.fillStyle=t.c; ctx.fillText(t.txt,t.x,t.y); }
  ctx.globalAlpha=1;
}

/* 금광 */
function drawMine(side){
  const x=mineX(side);
  ctx.save(); ctx.lineWidth=2.6; ctx.lineJoin='round'; ctx.strokeStyle='#1b2430'; ctx.fillStyle='#e3ebf1';
  ctx.beginPath();
  ctx.moveTo(x-42,gy); ctx.lineTo(x-26,gy-58); ctx.lineTo(x+2,gy-74);
  ctx.lineTo(x+30,gy-52); ctx.lineTo(x+44,gy); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle='#e8b23a';
  const spots=[[-14,-20],[4,-38],[18,-16],[-2,-8],[24,-34],[-24,-36]];
  for(const s of spots){
    ctx.beginPath(); ctx.arc(x+s[0], gy+s[1], 4, 0, 7); ctx.fill();
    ctx.strokeStyle='#a87d16'; ctx.lineWidth=1.4; ctx.stroke();
  }
  ctx.strokeStyle='#1b2430'; ctx.lineWidth=2.2;
  ctx.beginPath(); ctx.moveTo(x-8,gy); ctx.lineTo(x-8,gy-22); ctx.lineTo(x+12,gy-22); ctx.lineTo(x+12,gy); ctx.stroke();
  ctx.restore();
}

function drawBase(b, side){
  const ally=side==='a', w=52, h=118, x=b.x, top=gy-h;
  ctx.save(); ctx.lineWidth=3; ctx.lineJoin='round'; ctx.strokeStyle='#1b2430'; ctx.fillStyle='#f4f8fa';
  ctx.beginPath(); ctx.rect(x-w/2, top, w, h); ctx.fill(); ctx.stroke();
  for(let i=0;i<3;i++){ ctx.beginPath(); ctx.rect(x-w/2+i*(w/3)+2, top-12, w/3-5, 12); ctx.fill(); ctx.stroke(); }
  ctx.beginPath(); ctx.rect(x-11, gy-40, 22, 40); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x, top-12); ctx.lineTo(x, top-52); ctx.stroke();
  ctx.fillStyle = ally?'#1f5fd0':'#c9302c';
  const f=Math.sin(G.t*4)*4;
  ctx.beginPath(); ctx.moveTo(x,top-52); ctx.lineTo(x+(ally?30:-30), top-46+f); ctx.lineTo(x,top-36); ctx.closePath(); ctx.fill();
  if(W(side).up.turret>0){
    ctx.strokeStyle = ally?'#1f5fd0':'#c9302c'; ctx.lineWidth=2.6;
    const tx = x + dirOf(side)*6;
    ctx.beginPath(); ctx.arc(tx, top-24, 5, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(tx, top-19); ctx.lineTo(tx, top-6); ctx.stroke();
  }
  const r=b.hp/b.max;
  ctx.fillStyle='#c7d2dc'; ctx.fillRect(x-32, top-70, 64, 8);
  ctx.fillStyle= ally?'#1f5fd0':'#c9302c'; ctx.fillRect(x-32, top-70, 64*r, 8);
  ctx.strokeStyle='#1b2430'; ctx.lineWidth=1.6; ctx.strokeRect(x-32, top-70, 64, 8);
  ctx.restore();
}

function drawUnit(u){
  const ally=u.side==='a', h=u.size;
  let dir = ally?1:-1;
  if(u.type==='miner') dir = dirOf(u.side) * ((u.job==='toMine') ? -1 : 1);
  // T.col 이 있으면 그 색을 쓴다. 3판에 적 다섯 종이 섞여 나오는데 전부
  // 같은 빨강이면 무엇이 오는지 구분할 수 없다.
  const col = u.hurt>0 ? '#f0663f'
            : (u.type==='miner' ? '#c98f1a'
            : (u.T.col ? u.T.col : (ally?'#1f5fd0':'#c9302c')));
  ctx.save(); ctx.translate(u.x, gy+u.yo);
  ctx.globalAlpha=.13; ctx.fillStyle='#1b2430';
  ctx.beginPath(); ctx.ellipse(0,0,h*.2,h*.05,0,0,7); ctx.fill(); ctx.globalAlpha=1;
  if(u.dead){
    const k=Math.min(1,u.dead/.5);
    ctx.globalAlpha=Math.max(0,1-u.dead/1.3);
    ctx.rotate(dir*k*Math.PI/2*.92); ctx.translate(0,-2);
  }
  ctx.scale(dir,1);
  const lw=Math.max(2.2,h*.055);
  ctx.lineWidth=lw; ctx.lineCap='round'; ctx.strokeStyle=col;
  const hipY=-h*.42, shY=-h*.72, headY=-h*.855, hr=h*.125;
  const p=Math.sin(u.ph);

  ctx.beginPath();
  ctx.moveTo(0,hipY); ctx.lineTo(p*h*.15,hipY*.5); ctx.lineTo(p*h*.2,0);
  ctx.moveTo(0,hipY); ctx.lineTo(-p*h*.15,hipY*.5); ctx.lineTo(-p*h*.2,0);
  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,hipY); ctx.lineTo(0,shY); ctx.stroke();
  ctx.beginPath(); ctx.arc(0,headY,hr,0,7); ctx.stroke();

  const sw=u.sw;
  const armA=-0.6-sw*1.5;
  const hx=Math.cos(armA)*h*.3, hy=shY+Math.sin(armA)*h*.3;

  if(u.type==='miner'){
    const swing = u.job==='mining' ? u.sw : 0;
    const a = -1.5 + swing*1.9;
    const px = Math.cos(a)*h*.32, py = shY+Math.sin(a)*h*.32;
    ctx.beginPath(); ctx.moveTo(0,shY); ctx.lineTo(px,py); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,shY); ctx.lineTo(px*.7,py*.92); ctx.stroke();
    /* 곡괭이 */
    ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px+Math.cos(a)*h*.3, py+Math.sin(a)*h*.3); ctx.stroke();
    const tx2=px+Math.cos(a)*h*.3, ty2=py+Math.sin(a)*h*.3;
    ctx.beginPath(); ctx.moveTo(tx2-h*.12, ty2-h*.05); ctx.lineTo(tx2+h*.12, ty2+h*.05); ctx.stroke();
    if(u.carry>0){
      ctx.fillStyle='#e8b23a'; ctx.strokeStyle='#a87d16'; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.rect(-h*.11, headY-h*.34, h*.22, h*.16); ctx.fill(); ctx.stroke();
      ctx.strokeStyle=col; ctx.lineWidth=lw;
    }
  } else if(u.type==='archer'){
    ctx.beginPath(); ctx.moveTo(0,shY); ctx.lineTo(h*.26,shY-h*.02); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,shY); ctx.lineTo(h*.13,shY+h*.1); ctx.stroke();
    ctx.beginPath(); ctx.arc(h*.3,shY-h*.02,h*.17,-1.15,1.15); ctx.stroke();
    ctx.lineWidth=lw*.55;
    const pull=h*.09*(1-sw);
    ctx.beginPath();
    ctx.moveTo(h*.3+Math.cos(-1.15)*h*.17, shY-h*.02+Math.sin(-1.15)*h*.17);
    ctx.lineTo(h*.3-pull, shY-h*.02);
    ctx.lineTo(h*.3+Math.cos(1.15)*h*.17, shY-h*.02+Math.sin(1.15)*h*.17);
    ctx.stroke(); ctx.lineWidth=lw;
  } else if(u.type==='spear'){
    ctx.beginPath(); ctx.moveTo(0,shY); ctx.lineTo(-h*.18,shY+h*.13); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,shY); ctx.lineTo(hx,hy); ctx.stroke();
    /* 창대. 찌를 때 앞으로 뻗는다 */
    const sa = armA*.3 + sw*.85, len=h*.95;
    const bx = hx-Math.cos(sa)*h*.2, by = hy-Math.sin(sa)*h*.2;
    ctx.lineWidth=lw*.8;
    ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(bx+Math.cos(sa)*len, by+Math.sin(sa)*len); ctx.stroke();
    ctx.lineWidth=lw;
  } else if(u.type==='medic'){
    ctx.beginPath(); ctx.moveTo(0,shY); ctx.lineTo(-h*.18,shY+h*.12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,shY); ctx.lineTo(h*.2,shY-h*.14); ctx.stroke();
    /* 초록 십자. 이 색이 아군 파랑과 겹치지 않아 한눈에 구분된다 */
    ctx.strokeStyle='#7fd39b'; ctx.lineWidth=lw*1.15;
    ctx.beginPath(); ctx.moveTo(h*.2,shY-h*.3); ctx.lineTo(h*.2,shY-h*.04); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(h*.07,shY-h*.17); ctx.lineTo(h*.33,shY-h*.17); ctx.stroke();
    ctx.strokeStyle=col; ctx.lineWidth=lw;
  } else if(u.type==='cavalry'){
    /* 말 위에서 창을 낮게 겨눈다 */
    ctx.lineWidth=lw*.9;
    ctx.beginPath(); ctx.ellipse(-h*.05, -h*.2, h*.3, h*.11, 0, 0, 7); ctx.stroke();
    for(const o of [-.26,-.08,.1,.28]){
      ctx.beginPath(); ctx.moveTo(h*o, -h*.14); ctx.lineTo(h*o+p*h*.06, 0); ctx.stroke();
    }
    ctx.lineWidth=lw;
    ctx.beginPath(); ctx.moveTo(0,shY); ctx.lineTo(hx,hy); ctx.stroke();
    const la = -0.15 + sw*.5;
    ctx.lineWidth=lw*.8;
    ctx.beginPath(); ctx.moveTo(hx-Math.cos(la)*h*.2, hy-Math.sin(la)*h*.2);
    ctx.lineTo(hx+Math.cos(la)*h*.75, hy+Math.sin(la)*h*.75); ctx.stroke();
    ctx.lineWidth=lw;
  } else if(u.type==='priest'){
    ctx.beginPath(); ctx.moveTo(0,shY); ctx.lineTo(-h*.17,shY+h*.13); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,shY); ctx.lineTo(h*.2,shY-h*.12); ctx.stroke();
    ctx.strokeStyle='#3fa96b'; ctx.lineWidth=lw*1.1;
    ctx.beginPath(); ctx.moveTo(h*.2,shY-h*.34); ctx.lineTo(h*.2,shY+h*.16); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(h*.06,shY-h*.2); ctx.lineTo(h*.34,shY-h*.2); ctx.stroke();
    ctx.strokeStyle=col; ctx.lineWidth=lw;
  } else if(u.type==='hero'){
    ctx.beginPath(); ctx.moveTo(0,shY); ctx.lineTo(-h*.22,shY+h*.2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,shY); ctx.lineTo(hx,hy); ctx.stroke();
    /* 전설의 검 — 크게, 휘두를수록 앞으로 */
    const ba = armA-.7+sw*1.6;
    ctx.lineWidth=lw*1.6;
    ctx.beginPath(); ctx.moveTo(hx,hy); ctx.lineTo(hx+Math.cos(ba)*h*.7, hy+Math.sin(ba)*h*.7); ctx.stroke();
    ctx.lineWidth=lw*.9; ctx.strokeStyle='#ffe9a8';
    ctx.beginPath(); ctx.moveTo(hx,hy); ctx.lineTo(hx+Math.cos(ba)*h*.62, hy+Math.sin(ba)*h*.62); ctx.stroke();
    ctx.strokeStyle=col; ctx.lineWidth=lw;
  } else if(u.type==='berserk'){
    /* 거대 철퇴. 평소엔 뒤로 끌고, 칠 때 앞으로 내려찍는다 */
    const a = .55 + (1-sw)*2.15;
    const armLen=h*.30;
    const hxx=Math.cos(a)*armLen, hyy=shY+Math.sin(a)*armLen;
    ctx.lineWidth=lw*1.15;
    ctx.beginPath(); ctx.moveTo(0,shY); ctx.lineTo(hxx,hyy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,shY-h*.03); ctx.lineTo(hxx*.72,hyy*.94); ctx.stroke();
    const hl=h*.6;
    const ex=hxx+Math.cos(a)*hl, ey=hyy+Math.sin(a)*hl;
    ctx.lineWidth=lw*1.6;
    ctx.beginPath(); ctx.moveTo(hxx,hyy); ctx.lineTo(ex,ey); ctx.stroke();
    /* 철퇴 머리 — 덩어리에 가시를 두른다 */
    ctx.save(); ctx.translate(ex,ey); ctx.rotate(a);
    const R=h*.17;
    ctx.lineWidth=lw*.9; ctx.strokeStyle='#1b2430'; ctx.fillStyle='#8a94a3';
    for(let i=0;i<8;i++){
      const t2=i*Math.PI/4;
      ctx.beginPath();
      ctx.moveTo(Math.cos(t2)*R*.8, Math.sin(t2)*R*.8);
      ctx.lineTo(Math.cos(t2)*R*1.55, Math.sin(t2)*R*1.55); ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(0,0,R,0,7); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#6b7785';
    ctx.beginPath(); ctx.arc(-R*.25,-R*.25,R*.42,0,7); ctx.fill();
    ctx.restore();
    ctx.strokeStyle=col; ctx.lineWidth=lw;
    ctx.lineWidth=lw*.7;
    ctx.beginPath();
    ctx.moveTo(-hr*.6, headY-hr*.25); ctx.lineTo(-hr*.1, headY);
    ctx.moveTo( hr*.6, headY-hr*.25); ctx.lineTo( hr*.1, headY); ctx.stroke();
    ctx.lineWidth=lw;
  } else if(u.T.titan){
    /* 기계다. 어깨 장갑 · 가슴 코어 · 바이저 · 손목 캐논 · 대검 */
    const st = u.lastStage|0;
    const glow = u.T.infected ? '#9ff06f' : '#78f0ff';
    const core = u.T.infected ? '#e6ffd8' : '#d8fbff';
    ctx.lineWidth=lw*1.35;
    ctx.beginPath(); ctx.moveTo(-h*.19,shY); ctx.lineTo(h*.19,shY); ctx.stroke();
    ctx.fillStyle = u.T.infected ? '#2a3a24' : '#22323f';
    for(const sgn of [-1,1]){
      ctx.beginPath(); ctx.arc(sgn*h*.19, shY+h*.01, h*.09, Math.PI, 0);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    /* 가슴 코어 — 뛴다. 코어 빔(3단) 시전 중에는 크게 밝아진다 */
    const cy=shY+h*.13;
    const pulse = .5 + Math.sin(G.t*6+u.id)*.2 + (st===2 ? .9*sw : 0);
    ctx.fillStyle = 'rgba('+(u.T.infected?'150,240,110':'120,240,255')+','+(.22+pulse*.4)+')';
    ctx.beginPath(); ctx.arc(0, cy, h*.10*(1+pulse*.35), 0, 7); ctx.fill();
    ctx.fillStyle=core;
    ctx.beginPath(); ctx.arc(0, cy, h*.045, 0, 7); ctx.fill();
    ctx.strokeStyle=glow; ctx.lineWidth=lw*.8;
    ctx.beginPath(); ctx.arc(0, cy, h*.10, 0, 7); ctx.stroke();
    ctx.strokeStyle=col; ctx.lineWidth=lw*1.35;
    /* 바이저 */
    ctx.beginPath(); ctx.moveTo(-hr*.85, headY-hr*.1); ctx.lineTo(hr*.85, headY-hr*.1); ctx.stroke();
    ctx.strokeStyle = u.T.infected ? '#b6ff7a' : '#ff8f6f'; ctx.lineWidth=lw*.9;
    ctx.beginPath(); ctx.moveTo(-hr*.55, headY+hr*.15); ctx.lineTo(hr*.55, headY+hr*.15); ctx.stroke();
    ctx.strokeStyle=col; ctx.lineWidth=lw*1.35;

    /* 왼팔 — 손목 레이저 캐논. 1단에서 앞으로 뻗고 총구가 탄다 */
    const ca = st===0 ? (0.55 - sw*.75) : 0.55;
    const lox=-h*.19;
    const cxa=lox+Math.cos(ca)*h*.30, cya=shY+h*.02+Math.sin(ca)*h*.30;
    ctx.beginPath(); ctx.moveTo(lox,shY+h*.02); ctx.lineTo(cxa,cya); ctx.stroke();
    ctx.save(); ctx.translate(cxa,cya); ctx.rotate(ca);
    ctx.fillStyle = u.T.infected ? '#1e2c1a' : '#20303f';
    ctx.strokeStyle=col; ctx.lineWidth=lw;
    ctx.beginPath(); ctx.rect(-h*.03, -h*.075, h*.30, h*.15); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(h*.27,-h*.045); ctx.lineTo(h*.34,0); ctx.lineTo(h*.27,h*.045); ctx.stroke();
    if(st===0 && sw>.1){
      ctx.fillStyle='rgba('+(u.T.infected?'190,255,140':'255,140,110')+','+(sw*.9)+')';
      ctx.beginPath(); ctx.arc(h*.36, 0, h*.07*sw+3, 0, 7); ctx.fill();
    }
    ctx.restore();
    ctx.strokeStyle=col; ctx.lineWidth=lw*1.35;

    /* 오른팔 — 대검. 어깨에 걸치다 2단에서 내려찍는다 */
    const rest=-2.15;
    const sa2 = st===1 ? (rest + sw*3.0) : rest;
    const rox=h*.19;
    const gx2=rox+Math.cos(sa2)*h*.32, gy3=shY+h*.02+Math.sin(sa2)*h*.32;
    ctx.beginPath(); ctx.moveTo(rox,shY+h*.02); ctx.lineTo(gx2,gy3); ctx.stroke();
    const bl2=h*.88, ba2=sa2+.06;
    const ex2=gx2+Math.cos(ba2)*bl2, ey2=gy3+Math.sin(ba2)*bl2;
    ctx.strokeStyle = u.T.infected ? '#c8e0b8' : '#cfe0ee';
    ctx.lineWidth=lw*1.9; ctx.lineCap='butt';
    ctx.beginPath(); ctx.moveTo(gx2,gy3); ctx.lineTo(ex2,ey2); ctx.stroke();
    ctx.strokeStyle='#1b2430'; ctx.lineWidth=lw*.9;
    ctx.beginPath(); ctx.moveTo(gx2,gy3); ctx.lineTo(ex2,ey2); ctx.stroke();
    ctx.lineCap='round';
    ctx.strokeStyle='#e8b23a'; ctx.lineWidth=lw*1.2;
    ctx.beginPath();
    ctx.moveTo(gx2+Math.cos(ba2+1.57)*h*.13, gy3+Math.sin(ba2+1.57)*h*.13);
    ctx.lineTo(gx2+Math.cos(ba2-1.57)*h*.13, gy3+Math.sin(ba2-1.57)*h*.13); ctx.stroke();
    ctx.strokeStyle=col; ctx.lineWidth=lw;
  } else if(u.type==='mage' || u.type==='frost'){
    const magic = u.type==='mage' ? '#bfe6ff' : '#7fd0ff';
    ctx.beginPath(); ctx.moveTo(0,shY); ctx.lineTo(-h*.17,shY+h*.13); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,shY); ctx.lineTo(hx*.8,hy*.98); ctx.stroke();
    /* 지팡이 */
    const sx=hx*.8, sy=hy*.98;
    ctx.beginPath(); ctx.moveTo(sx,sy-h*.38); ctx.lineTo(sx,sy+h*.34); ctx.stroke();
    /* 끝의 빛. 시전할수록(sw) 커진다 */
    ctx.strokeStyle=magic; ctx.lineWidth=lw*.9;
    const rr = h*.09*(1+sw*.9);
    ctx.beginPath(); ctx.arc(sx, sy-h*.38, rr, 0, 7); ctx.stroke();
    if(u.type==='frost'){
      for(let i=0;i<3;i++){
        const a=i*Math.PI/3;
        ctx.beginPath();
        ctx.moveTo(sx-Math.cos(a)*rr*1.7, sy-h*.38-Math.sin(a)*rr*1.7);
        ctx.lineTo(sx+Math.cos(a)*rr*1.7, sy-h*.38+Math.sin(a)*rr*1.7);
        ctx.stroke();
      }
    }
    ctx.strokeStyle=col; ctx.lineWidth=lw;
  } else if(u.type==='bomber'){
    ctx.beginPath(); ctx.moveTo(0,shY); ctx.lineTo(-h*.18,shY+h*.12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,shY); ctx.lineTo(hx,hy); ctx.stroke();
    ctx.beginPath(); ctx.arc(hx+h*.09, hy-h*.01, h*.1, 0, 7); ctx.stroke();
    ctx.lineWidth=lw*.7;
    ctx.beginPath(); ctx.moveTo(hx+h*.13,hy-h*.09); ctx.lineTo(hx+h*.2,hy-h*.19); ctx.stroke();
    ctx.lineWidth=lw;
  } else if(u.type==='shield'){
    ctx.beginPath(); ctx.moveTo(0,shY); ctx.lineTo(hx*.7,hy*.98); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,shY); ctx.lineTo(h*.2,shY+h*.05); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(h*.22,shY-h*.16); ctx.lineTo(h*.34,shY-h*.1);
    ctx.lineTo(h*.34,shY+h*.2); ctx.lineTo(h*.22,shY+h*.3); ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(hx*.7,hy*.98); ctx.lineTo(hx*.7+h*.26,hy*.98-h*.16); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(0,shY); ctx.lineTo(-h*.2,shY+h*.12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,shY); ctx.lineTo(hx,hy); ctx.stroke();
    const blade = u.type==='giant'?h*.5:h*.42;
    const ba = armA-.5+sw*1.3;
    ctx.lineWidth = u.type==='giant'?lw*1.7:lw*1.1;
    ctx.beginPath(); ctx.moveTo(hx,hy); ctx.lineTo(hx+Math.cos(ba)*blade, hy+Math.sin(ba)*blade); ctx.stroke();
    ctx.lineWidth=lw;
  }
  ctx.restore();

  if(!u.dead && u.slowT>0){
    /* 얼었다는 것이 몸이 아니라 발밑에 보여야 한다. 몸 색을 바꾸면
       아군·적군 구분이 흐려진다. */
    ctx.save();
    ctx.strokeStyle='#7fd0ff'; ctx.lineWidth=2; ctx.globalAlpha=.85;
    const w=h*.22;
    ctx.beginPath();
    ctx.moveTo(u.x-w, gy+u.yo); ctx.lineTo(u.x+w, gy+u.yo);
    ctx.moveTo(u.x-w*.6, gy+u.yo-4); ctx.lineTo(u.x+w*.6, gy+u.yo-4);
    ctx.stroke();
    ctx.restore();
  }

  if(!u.dead && u.ward>0){
    /* 광부는 무적이다. 그 사실이 화면에도 보여야 한다. */
    ctx.save();
    const a = Math.min(1, u.ward/.5);
    ctx.beginPath(); ctx.arc(u.x, gy - h*.5 + u.yo, h*.8, 0, Math.PI*2);
    ctx.globalAlpha = .10 + a*.16; ctx.fillStyle = '#9fd8ff'; ctx.fill();
    ctx.globalAlpha = .30 + a*.55; ctx.strokeStyle = '#cfeaff';
    ctx.lineWidth = 2 + a*1.6; ctx.stroke();
    ctx.restore();
  }

  if(!u.dead && u.hp<u.max){
    const w=h*.5, r=u.hp/u.max;
    ctx.fillStyle='#c7d2dc'; ctx.fillRect(u.x-w/2, gy+u.yo-h-13, w, 4);
    ctx.fillStyle=col; ctx.fillRect(u.x-w/2, gy+u.yo-h-13, w*r, 4);
  }
}

/* ============ 사운드 ============ */
let AC=null, sound=true;
function beep(f,d,g){
  if(!sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), v=AC.createGain();
    o.type='square'; o.frequency.value=f; v.gain.value=g||.04;
    o.connect(v); v.connect(AC.destination); o.start();
    v.gain.exponentialRampToValueAtTime(.0001, AC.currentTime+(d||.08));
    o.stop(AC.currentTime+(d||.08)+.02);
  }catch(e){}
}

/** 유닛 버튼 그림을 내 진영 색으로 다시 그린다. */
function paintIcons(){ for(const k of ORDER) iconOf(btns[k].querySelector('canvas'), k); }
function iconOf(c,k){
  const x=c.getContext('2d'), h=52;
  // 다시 그릴 수 있어야 한다. 변환을 초기화하지 않으면 부를 때마다 밀린다.
  x.setTransform(1,0,0,1,0,0);
  x.clearRect(0,0,c.width,c.height);
  x.translate(30,64); x.scale(.9,.9);
  x.strokeStyle = k==='miner' ? '#e0b45f'
    : (k==='medic'||k==='priest' ? '#8fd8ae'
    : (k==='titan' ? '#8fd8e8' : TEAM[ME].ink));
  x.lineWidth=2.6; x.lineCap='round';
  const hip=-h*.42, sh=-h*.72;
  x.beginPath();
  x.moveTo(0,hip); x.lineTo(7,hip*.5); x.lineTo(9,0);
  x.moveTo(0,hip); x.lineTo(-7,hip*.5); x.lineTo(-9,0);
  x.moveTo(0,hip); x.lineTo(0,sh); x.stroke();
  x.beginPath(); x.arc(0,-h*.855,h*.125,0,7); x.stroke();
  if(k==='miner'){
    x.beginPath(); x.moveTo(0,sh); x.lineTo(10,sh-9); x.stroke();
    x.beginPath(); x.moveTo(10,sh-9); x.lineTo(18,sh-17); x.stroke();
    x.beginPath(); x.moveTo(13,sh-21); x.lineTo(22,sh-13); x.stroke();
  } else if(k==='archer'){
    x.beginPath(); x.moveTo(0,sh); x.lineTo(13,sh); x.stroke();
    x.beginPath(); x.arc(15,sh,8,-1.15,1.15); x.stroke();
  } else if(k==='shield'){
    x.beginPath(); x.moveTo(0,sh); x.lineTo(10,sh+3); x.stroke();
    x.beginPath(); x.rect(11,sh-8,7,18); x.stroke();
  } else if(k==='spear'){
    x.beginPath(); x.moveTo(0,sh); x.lineTo(9,sh+2); x.stroke();
    x.lineWidth=2.1;
    x.beginPath(); x.moveTo(2,sh+9); x.lineTo(27,sh-9); x.stroke();
    x.lineWidth=2.6;
  } else if(k==='medic'){
    x.beginPath(); x.moveTo(0,sh); x.lineTo(9,sh-5); x.stroke();
    x.strokeStyle='#7fd39b'; x.lineWidth=3.2;
    x.beginPath(); x.moveTo(13,sh-14); x.lineTo(13,sh-1); x.stroke();
    x.beginPath(); x.moveTo(7,sh-8); x.lineTo(19,sh-8); x.stroke();
    x.lineWidth=2.6;
  } else if(k==='cavalry'){
    x.beginPath(); x.ellipse(-2,-12,13,5,0,0,7); x.stroke();
    x.beginPath(); x.moveTo(-9,-8); x.lineTo(-9,0); x.moveTo(6,-8); x.lineTo(6,0); x.stroke();
    x.lineWidth=2.1;
    x.beginPath(); x.moveTo(-4,sh+8); x.lineTo(24,sh-2); x.stroke();
    x.lineWidth=2.6;
  } else if(k==='priest'){
    x.beginPath(); x.moveTo(0,sh); x.lineTo(9,sh-5); x.stroke();
    x.strokeStyle='#7fdcae'; x.lineWidth=3;
    x.beginPath(); x.moveTo(13,sh-16); x.lineTo(13,sh+4); x.stroke();
    x.beginPath(); x.moveTo(7,sh-9); x.lineTo(19,sh-9); x.stroke();
    x.lineWidth=2.6;
  } else if(k==='hero'){
    x.beginPath(); x.moveTo(0,sh); x.lineTo(10,sh+4); x.stroke();
    x.lineWidth=4;
    x.beginPath(); x.moveTo(10,sh+4); x.lineTo(27,sh-16); x.stroke();
    x.strokeStyle='#ffe9a8'; x.lineWidth=2;
    x.beginPath(); x.moveTo(10,sh+4); x.lineTo(25,sh-14); x.stroke();
    x.lineWidth=2.6;
  } else if(k==='berserk'){
    /* 철퇴 — 자루와 가시 머리 */
    x.beginPath(); x.moveTo(0,sh); x.lineTo(8,sh+3); x.stroke();
    x.lineWidth=3.4;
    x.beginPath(); x.moveTo(8,sh+3); x.lineTo(19,sh-9); x.stroke();
    x.lineWidth=2;
    for(let i=0;i<6;i++){ const t=i*Math.PI/3;
      x.beginPath(); x.moveTo(21+Math.cos(t)*4, sh-11+Math.sin(t)*4);
      x.lineTo(21+Math.cos(t)*8, sh-11+Math.sin(t)*8); x.stroke(); }
    x.beginPath(); x.arc(21,sh-11,5,0,7); x.stroke();
    x.lineWidth=2.6;
  } else if(k==='titan'){
    x.lineWidth=3;
    x.beginPath(); x.rect(-9,sh-8,18,20); x.stroke();
    x.beginPath(); x.moveTo(-9,sh-4); x.lineTo(-17,sh+6); x.stroke();
    x.beginPath(); x.moveTo(9,sh-4); x.lineTo(19,sh+2); x.stroke();
    x.strokeStyle='#8fd8e8'; x.lineWidth=2.6;
    x.beginPath(); x.arc(0,sh+2,4,0,7); x.stroke();
  } else if(k==='mage' || k==='frost'){
    x.beginPath(); x.moveTo(0,sh); x.lineTo(10,sh-2); x.stroke();
    x.beginPath(); x.moveTo(12,sh-16); x.lineTo(12,sh+8); x.stroke();
    x.strokeStyle = k==='mage' ? '#bfe6ff' : '#7fd0ff'; x.lineWidth=2.2;
    x.beginPath(); x.arc(12,sh-18,5,0,7); x.stroke();
    if(k==='frost'){
      for(let i=0;i<3;i++){ const a=i*Math.PI/3;
        x.beginPath();
        x.moveTo(12-Math.cos(a)*8, sh-18-Math.sin(a)*8);
        x.lineTo(12+Math.cos(a)*8, sh-18+Math.sin(a)*8); x.stroke(); }
    } else {
      x.beginPath(); x.moveTo(6,sh-26); x.lineTo(12,sh-20); x.lineTo(8,sh-18); x.lineTo(16,sh-10); x.stroke();
    }
    x.lineWidth=2.6;
  } else if(k==='bomber'){
    x.beginPath(); x.moveTo(0,sh); x.lineTo(10,sh-3); x.stroke();
    x.beginPath(); x.arc(15,sh-6,6,0,7); x.stroke();
    x.lineWidth=1.9;
    x.beginPath(); x.moveTo(18,sh-11); x.lineTo(22,sh-16); x.stroke();
    x.lineWidth=2.6;
  } else {
    x.beginPath(); x.moveTo(0,sh); x.lineTo(11,sh+6); x.stroke();
    x.beginPath(); x.moveTo(11,sh+6); x.lineTo(24,sh-9); x.lineWidth=k==='giant'?4.4:3; x.stroke();
  }
}

/**
 * 병사를 산다. `side` 를 주면 그 진영이 사는 것이다 — 1v1 에서 상대의
 * 주문을 그대로 흘려 넣는 자리다. 안 주면 이 화면의 주인이 산다.
 *
 * **값 확인과 지불이 여기 한 곳에만 있어야 한다.** 상대 주문을 따로
 * 처리하면 한쪽만 고쳐져 공짜로 사는 길이 생긴다.
 */
function buy(k, side='a', silent=false){
  if(G.over) return false;
  const T=TYPES[k], w=W(side);
  if(k==='miner' && minerCount(side)>=MAX_MINERS){
    if(!silent){ banner('광부는 최대 '+MAX_MINERS+'명'); beep(90,.06,.03); }
    return false;
  }
  if(w.gold < T.cost){ if(!silent) beep(90,.06,.03); return false; }
  w.gold -= T.cost;
  spawn(k,side);
  if(!silent) beep(k==='miner'?520:660,.05,.035);
  return true;
}

/**
 * 화살비. 진영을 받는다 — 1v1 에서 상대가 쓴 것도 같은 길로 들어온다.
 *
 * 재사용 대기는 **진영별**이다. 하나로 두면 상대가 쓴 순간 내 것도 잠긴다.
 */
function castRain(side){
  const w=W(side);
  if(w.rainCd>0 || G.over) return false;
  G.rain.push({t:1.7, tick:0, side});
  w.rainCd = ULT_CD;
  if(side===ME) banner('화살비');
  beep(880,.3,.05);
  return true;
}
document.getElementById('ult').addEventListener('pointerdown', e=>{
  e.preventDefault();
  if(net.on && net.ready && !net.host){ net.send({type:'cmd', what:'ult'}); return; }
  castRain(ME);
});

const UPS=[
  {k:'dmg',   ic:'⚔️', nm:'공격력',    d:lv=>'아군 전체 피해 +'+(lv*10)+'%',        c:lv=>Math.round(130*Math.pow(1.55,lv))},
  {k:'mine',  ic:'⛏️', nm:'채굴 장비',  d:lv=>'광부 1회 운반 '+(14+lv*5)+' 골드',    c:lv=>Math.round(140*Math.pow(1.6,lv))},
  {k:'turret',ic:'🏰', nm:'본진 포탑',  d:lv=>lv?('피해 '+(12+lv*8)+' · 연사 '+Math.max(.45,1.5-lv*.12).toFixed(2)+'초'):'본진에 궁수 배치', c:lv=>Math.round(170*Math.pow(1.65,lv))},
  {k:'base',  ic:'🧱', nm:'본진 보강',  d:lv=>'최대 체력 +300 · 즉시 회복',          c:lv=>Math.round(220*Math.pow(1.7,lv))}
];
/**
 * 강화 구매. 진영을 받는다.
 *
 * **본진 보강은 그 진영의 본진을 올린다.** 예전에는 baseA 를 못 박아 두어서,
 * 그대로 두면 상대가 산 보강이 내 본진 체력을 올려 주는 꼴이 된다.
 */
function buyUp(k, side){
  const spec = UPS.find(u=>u.k===k);
  if(!spec || G.over) return false;
  const w = W(side), cost = spec.c(w.up[k]);
  if(w.gold < cost) return false;
  w.gold -= cost; w.up[k]++;
  if(k==='base'){
    const b = side==='a' ? G.baseA : G.baseB;
    b.max += 300; b.hp = Math.min(b.max, b.hp+300);
  }
  return true;
}

const uplist=document.getElementById('uplist');
let upRows=[], upSig='';
function renderUps(){
  uplist.innerHTML=''; upRows=[];
  upSig = UPS.map(u=>W(ME).up[u.k]).join(',');
  UPS.forEach(u=>{
    const lv=W(ME).up[u.k], cost=u.c(lv);
    const row=document.createElement('div');
    row.className='up';
    row.innerHTML='<div class="ic">'+u.ic+'</div><div class="tx"><b>'+u.nm+' Lv.'+lv+'</b><small>'+u.d(lv)+'</small></div>';
    const b=document.createElement('button');
    b.textContent=cost; b.disabled=W(ME).gold<cost;
    b.addEventListener('click',()=>{
      if(net.on && net.ready && !net.host){ net.send({type:'cmd', what:'up', k:u.k}); return; }
      if(buyUp(u.k, ME)){ beep(740,.1,.04); renderUps(); }
    });
    upRows.push({ cost, btn:b });
    row.appendChild(b); uplist.appendChild(row);
  });
}

/**
 * 열어 둔 팝업이 금을 따라가게 한다.
 *
 * 열 때 한 번만 그려서, 보고 있는 동안 광부가 금을 날라 와도 버튼이 잠긴
 * 채였다. 닫았다 다시 열어야 풀렸다.
 *
 * 매 프레임 DOM 을 새로 만들지는 않는다 — 누르는 도중에 버튼이 갈리면
 * 탭이 씹힌다. 값이 바뀐 것만 손본다.
 */
function syncUps(){
  if(!modal.classList.contains('on')) return;
  const gold = W(ME).gold;
  for(const r of upRows) r.btn.disabled = gold < r.cost;
  // 레벨이 바뀌면(내가 샀든 1v1 에서 호스트가 처리했든) 값과 설명을 다시 그린다.
  const sig = UPS.map(u=>W(ME).up[u.k]).join(',');
  if(sig !== upSig){ upSig = sig; renderUps(); }
}
const modal=document.getElementById('modal');
document.getElementById('upBtn').addEventListener('click',()=>{ renderUps(); modal.classList.add('on'); });
document.getElementById('closeUp').addEventListener('click',()=>modal.classList.remove('on'));
document.getElementById('again').addEventListener('click',()=>{
  // 1v1 은 판 진행이 없다. 판을 넘기면 상대와 다른 판을 하게 된다.
  if(net.on){
    net.close(); ME='a'; paintTeam(); stageIx=0;
    document.getElementById('over').classList.remove('on');
    newGame(); openLobby(); lobbyStatus('');
    return;
  }
  const won = foeBase().hp<=0;
  if(won){
    if(stageIx >= STAGES.length-1) stageIx = 0;  // 전역 완료 — 처음부터
    else stageIx += 1;
  }
  // 지면 같은 판을 다시 한다. 어느 쪽이든 강화는 초기화다.
  document.getElementById('over').classList.remove('on'); newGame();
});

/**
 * 더블탭 확대 막기 — iOS 대비 안전장치.
 *
 * 뷰포트의 `user-scalable=no` 와 `maximum-scale=1` 은 **iOS Safari 가
 * 접근성을 이유로 무시한다.** touch-action 만으로 안 잡히는 경우가 남아,
 * 짧은 간격의 두 번째 탭은 기본 동작을 직접 끊는다.
 *
 * **버튼 위에서는 건드리지 않는다.** 이 게임의 강화·닫기·다시 시작은
 * click 으로 도는데, 여기서 기본 동작을 막으면 강화를 연달아 두 번 누를 때
 * 두 번째가 먹지 않는다. 버튼에는 이미 manipulation 이 걸려 있어
 * 더블탭 확대가 나지 않는다.
 */
let lastTapEnd = 0;
addEventListener('touchend', e=>{
  const now = performance.now();
  const onButton = e.target instanceof Element && e.target.closest('button, a');
  if(!onButton && now - lastTapEnd <= 320) e.preventDefault();
  lastTapEnd = now;
}, {passive:false});

let drag=null;
// 끄는 손가락을 **하나로 고정한다.** 지도를 끄는 도중 다른 손가락으로 유닛
// 버튼을 누르면, 그 손가락의 pointermove 까지 카메라에 먹혀 화면이 튄다.
cv.addEventListener('pointerdown',e=>{
  if(drag) return;
  drag={x:e.clientX,c:cam,id:e.pointerId};
  // 캔버스 밖으로 손가락이 나가도 이 요소가 계속 이벤트를 받는다.
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
});
addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id) return;
  cam=clamp(drag.c-(e.clientX-drag.x)/scale,0,WORLD-VIEW); camUser=2.5;
});
const endDrag=e=>{ if(drag&&e.pointerId===drag.id) drag=null; };
addEventListener('pointerup',endDrag);
addEventListener('pointercancel',endDrag);

/* ============ 온라인 1v1 ============ */
/**
 * 호스트 권한 방식이다.
 *
 * 먼저 들어온 쪽(호스트)이 자기 화면에서 시뮬레이션을 돌리고 스냅샷을 보낸다.
 * 게스트는 계산하지 않고 그 스냅샷을 그리며 자기 주문만 올린다.
 *
 * **게스트는 지갑을 스스로 깎지 않는다.** 그러면 두 화면의 잔액이 갈라지고,
 * 어느 쪽이 맞는지 아무도 모르게 된다. 값 확인과 지불은 호스트의 `buy()`
 * 한 곳에서만 일어난다.
 *
 * 서버(`party-stickman/`)는 자리를 나눠 주고 메시지를 건네주기만 한다.
 */
const NET_HOST = location.hostname==='localhost' || location.hostname==='127.0.0.1'
  ? 'localhost:8788'                      // wrangler dev
  : 'minchan-stickman.changame.workers.dev';

/** 스냅샷 주기(ms). 촘촘할수록 부드럽지만 폰 데이터가 는다. */
const SNAP_MS = 80;

const net = {
  on:false, host:false, seated:false, sock:null, room:'', ready:false, snapT:0, err:'',
  send(o){ if(this.sock && this.sock.readyState===1) this.sock.send(JSON.stringify(o)); },
  close(){ if(this.sock){ try{ this.sock.close(); }catch(_){} } this.sock=null; this.on=false; this.ready=false; this.seated=false; },
};

/**
 * 방 목록.
 *
 * 코드를 받아 적지 않아도 눌러서 들어가려는 것뿐이다. **이게 안 되어도
 * 코드로 붙는 길은 그대로 열려 있어야 한다** — 목록은 편의고 코드가 본선이다.
 */
let lobbySock = null;
function watchRooms(){
  if(lobbySock) return;
  const scheme = location.protocol==='https:' ? 'wss' : 'ws';
  try{
    lobbySock = new WebSocket(scheme+'://'+NET_HOST+'/parties/lobby/global');
  }catch(_){ return; }
  lobbySock.onmessage = ev => {
    let m; try{ m=JSON.parse(ev.data); }catch{ return; }
    if(m.type==='rooms') renderRooms(m.rooms);
  };
  lobbySock.onclose = () => { lobbySock=null; };
  lobbySock.onerror = () => { renderRooms(null); };
}

function renderRooms(list){
  const box=document.getElementById('rooms');
  if(!box) return;
  if(!list){ box.innerHTML='<div class="none">방 목록을 받지 못했다. 코드로는 들어갈 수 있다.</div>'; return; }
  // **내가 만든 방은 빼고 보여준다.** 눌러 봐야 내 방에 다시 붙을 뿐이고,
  // 그 사이 자리가 비었다 차면서 혼자 두 자리를 잡는 길이 열린다.
  const others = list.filter(r => !(net.on && r.code===net.room));
  if(!others.length){
    box.innerHTML = (net.on && net.room)
      ? '<div class="none">다른 방은 없다. 상대가 코드로 들어오면 시작한다.</div>'
      : '<div class="none">기다리는 방이 없다. 방을 만들어 보자.</div>';
    return;
  }
  box.innerHTML='';
  for(const r of others){
    const b=document.createElement('button');
    b.className='rm';
    b.innerHTML='<span class="c">'+r.code+'</span><span class="w">한 명 기다림 · 참가 ▸</span>';
    b.addEventListener('click', ()=>connect(r.code));
    box.appendChild(b);
  }
}

function roomCode(){
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // 헷갈리는 글자(I,O,0,1)는 뺀다
  let c=''; for(let i=0;i<4;i++) c+=A[Math.floor(Math.random()*A.length)];
  return c;
}

function connect(code){
  net.close();
  // **아직 방 코드를 보여주지 않는다.** 붙기도 전에 코드를 크게 띄우면
  // 실패해도 만들어진 것처럼 보인다 — 실제로 그렇게 읽혔다.
  document.getElementById('lobbyCode').textContent = '';
  net.room = code;
  net.on = true;
  net.err = '';
  const scheme = location.protocol==='https:' ? 'wss' : 'ws';
  const sock = new WebSocket(scheme+'://'+NET_HOST+'/parties/room/'+code);
  net.sock = sock;
  lobbyStatus('연결 중…');

  sock.onopen = () => lobbyStatus('상대를 기다리는 중…');
  sock.onerror = () => {
    net.err = '대전 서버가 아직 안 올라갔다.\n혼자 하기는 그대로 된다.';
    lobbyStatus(net.err, true);
  };
  sock.onclose = () => {
    if(!net.on) return;
    net.ready=false;
    // 한 번도 자리를 못 받았으면 서버가 없는 것이다. 판이 끊긴 게 아니다.
    if(!net.seated) lobbyStatus(net.err || '대전 서버에 붙지 못했다.', true);
    else banner('상대와 연결이 끊겼다');
    net.on=false;
  };
  sock.onmessage = ev => {
    let m; try{ m=JSON.parse(ev.data); }catch{ return; }
    if(m.type==='full'){ net.err='그 방은 이미 둘이다'; lobbyStatus(net.err); net.on=false; return; }
    if(m.type==='seat'){
      net.host = m.host;
      net.seated = true;
      ME = m.seat;
      paintTeam();
      // 여기서야 방이 실제로 생겼다. 이제 코드를 보여준다.
      document.getElementById('lobbyCode').textContent = code;
      lobbyStatus(net.host ? '방 코드 '+code+' — 상대를 기다린다' : '들어갔다. 시작을 기다린다');
      return;
    }
    if(m.type==='room'){
      // 대전 중에 하나가 빠지면 판이 성립하지 않는다.
      if(net.ready && m.players<2){
        net.ready=false;
        banner('상대가 나갔다');
        if(!G.over) finish(true);
        return;
      }
      lobbyStatus(m.ready ? '' : (net.host ? '방 코드 '+code+' — 상대를 기다린다' : '상대를 기다리는 중…'));
      if(m.ready && !net.ready){
        net.ready = true;
        stageIx = 0; newGame();
        // 양쪽 본진을 같게 맞춘다. 1인 판의 기울어진 값을 그대로 쓰면
        // 자리에 따라 이길 수 없는 판이 된다.
        for(const b of [G.baseA, G.baseB]){ b.max = DUEL_BASE_HP; b.hp = DUEL_BASE_HP; }
        closeLobby();
        banner(net.host ? '대전 시작 — 당신은 파랑' : '대전 시작 — 당신은 빨강');
      }
      return;
    }
    // 게스트의 주문. 호스트가 자기 시뮬에 그대로 넣는다.
    if(m.type==='cmd' && net.host){
      if(m.what==='unit') buy(m.k, 'b', true);
      else if(m.what==='up') buyUp(m.k, 'b');
      else if(m.what==='ult') castRain('b');
      return;
    }
    // 호스트의 스냅샷. 게스트는 이걸 그린다.
    if(m.type==='snap' && !net.host){ applySnap(m); return; }
  };
}

/** 보내는 상태. 유닛은 자리·체력만, 나머지는 요약이다. */
function snapshot(){
  return {
    type:'snap', t:G.t, over:G.over,
    ba:[G.baseA.hp,G.baseA.max], bb:[G.baseB.hp,G.baseB.max], front:Math.round(G.front),
    ga:Math.round(W('a').gold), gb:Math.round(W('b').gold),
    ua:W('a').up, ub:W('b').up,
    ca:+W('a').rainCd.toFixed(1), cb:+W('b').rainCd.toFixed(1),
    // id 를 맨 앞에 싣는다. 이게 있어야 게스트가 **같은 유닛을 알아보고**
    // 자리를 이어 붙일 수 있다. 없으면 스냅샷마다 새로 만들어 순간이동한다.
    u:G.units.map(u=>[
      u.id, u.type, u.side==='a'?0:1, Math.round(u.x), u.yo, Math.round(u.hp), Math.round(u.max),
      +u.dead.toFixed(2), +u.hurt.toFixed(2), +u.sw.toFixed(2), +u.ph.toFixed(1),
      u.job==='toMine'?0:(u.job==='mining'?1:2), Math.round(u.carry), +(u.slowT||0).toFixed(1),
    ]),
  };
}

/** 받은 상태를 그대로 그릴 수 있는 모양으로 편다. */
/**
 * 게스트가 스냅샷을 받는다.
 *
 * **유닛 객체를 다시 만들지 않는다.** 예전에는 스냅샷마다 통째로 새로
 * 만들어서, 초당 12번씩 200개 객체가 버려졌고 무엇보다 **자리가 순간이동**
 * 했다. 60fps 로 그리는데 위치는 12.5번만 갱신되니 뚝뚝 끊겨 보인다 —
 * "느리다" 로 읽히던 것이 이것이다.
 *
 * id 로 같은 유닛을 찾아 값만 갈아 끼우고, 이전 자리(`x0`)와 새 자리(`x1`)를
 * 남겨 둔다. 그 사이는 `lerpGuest()` 가 프레임마다 메운다.
 */
const seen = new Map();          // id → 유닛
let snapAt = 0, snapGap = SNAP_MS;

function applySnap(m){
  const now = performance.now();
  // 실제로 온 간격을 쓴다. 회선이 흔들리면 고정값으로는 못 맞춘다.
  if(snapAt) snapGap = Math.max(16, Math.min(500, now - snapAt));
  snapAt = now;

  G.t = m.t; G.over = m.over; G.front = m.front;
  W('a').rainCd = m.ca; W('b').rainCd = m.cb;
  G.baseA.hp=m.ba[0]; G.baseA.max=m.ba[1];
  G.baseB.hp=m.bb[0]; G.baseB.max=m.bb[1];
  W('a').gold=m.ga; W('b').gold=m.gb; W('a').up=m.ua; W('b').up=m.ub;

  const live = [];
  for(const a of m.u){
    const id=a[0], type=a[1];
    let u = seen.get(id);
    if(!u){
      u = { id, type, side:a[2]?'b':'a', T:TYPES[type], size:TYPES[type].size,
            dmg:TYPES[type].dmg, lane:1, cd:0, spread:0, bounty:0, x:a[3], x0:a[3] };
      seen.set(id, u);
    }
    u.x0 = u.x;                 // 지금 보이는 자리에서
    u.x1 = a[3];                // 새로 받은 자리로
    u.yo=a[4]; u.hp=a[5]; u.max=a[6];
    u.dead=a[7]; u.hurt=a[8]; u.sw=a[9]; u.ph=a[10];
    u.job = a[11]===0?'toMine':(a[11]===1?'mining':'toBase');
    u.carry=a[12]; u.slowT=a[13];
    live.push(u);
  }
  // 사라진 것은 지도에서도 지운다. 안 지우면 판이 길어질수록 샌다.
  if(seen.size > live.length*2){
    const alive=new Set(live.map(u=>u.id));
    for(const id of seen.keys()) if(!alive.has(id)) seen.delete(id);
  }
  G.units = live;

  if(G.over && !overShown) finish(foeBase().hp<=0);
}

/** 스냅샷 사이를 프레임마다 메운다. 게스트만 부른다. */
function lerpGuest(){
  const a = Math.min(1, (performance.now()-snapAt) / snapGap);
  for(const u of G.units) u.x = u.x0 + (u.x1 - u.x0) * a;
}
let overShown=false;

function lobbyStatus(t, bad){
  const e=document.getElementById('lobbyMsg');
  if(!e) return;
  e.textContent = t||'';
  e.classList.toggle('err', !!bad);
}
function closeLobby(){ document.getElementById('lobby').classList.add('off'); }
function openLobby(){
  document.getElementById('lobby').classList.remove('off');
  watchRooms();
}

/** 버튼이 누르는 창구. 게스트면 주문만 올리고 지갑은 건드리지 않는다. */
function order(k){
  if(net.on && net.ready && !net.host){ net.send({type:'cmd', what:'unit', k}); return; }
  buy(k, ME);
}

document.getElementById('btnSolo').addEventListener('click',()=>{
  net.close(); ME='a'; paintTeam(); stageIx=0; newGame(); closeLobby();
});
document.getElementById('btnHost').addEventListener('click',()=>{ connect(roomCode()); });
document.getElementById('btnJoin').addEventListener('click',()=>{
  const c=(document.getElementById('joinCode').value||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);
  if(c.length<4){ lobbyStatus('코드 네 글자를 넣어라', true); return; }
  connect(c);
});

const el=id=>document.getElementById(id);
function hud(dt){
  el('gold').textContent=Math.floor(W(ME).gold);
  const mc=minerCount(ME);
  el('grate').innerHTML='<b>'+TEAM[ME].nm+'</b> · 광부 '+mc+' · '+(mc*haul(ME)/2.9).toFixed(1)+'/초';
  el('mcnt').textContent=mc;
  // "아군 본진" 은 내 진영의 것이다. 게스트 화면에서 남의 체력을 자기 것으로
  // 읽으면 지고 있는 줄도 모르고 판이 끝난다.
  const mb=myBase(), fb=foeBase();
  el('hpA').textContent=Math.ceil(mb.hp);
  el('hpB').textContent=Math.ceil(fb.hp);
  el('barA').style.width=(mb.hp/mb.max*100)+'%';
  el('barB').style.width=(fb.hp/fb.max*100)+'%';
  for(const k of ORDER){
    const ok = W(ME).gold>=TYPES[k].cost && !(k==='miner'&&minerCount(ME)>=MAX_MINERS);
    btns[k].classList.toggle('off',!ok);
    btns[k].classList.toggle('rdy',ok);
  }
  // 전선. 0% 가 아군 본진, 100% 가 적 본진이다.
  // 전선도 내 쪽에서 본다. b 를 잡으면 오른쪽이 내 땅이다.
  const raw = clamp((G.front-BASE_A)/(BASE_B-BASE_A), 0, 1);
  const held = ME==='a' ? raw : 1-raw;
  el('barF').style.width=(held*100).toFixed(1)+'%';
  el('markF').style.left='50%';
  el('frontV').textContent = Math.round(held*100)+'%';
  el('frontV').style.color = held>=.55 ? '#7fd39b' : (held<=.45 ? '#e0605c' : '#cfdae5');

  const rc=W(ME).rainCd;
  syncUps();
  el('ultcd').style.width=(rc>0?(rc/ULT_CD*100):0)+'%';
  el('ult').classList.toggle('hot',rc<=0);
  if(bannerHold>0) bannerHold-=dt;
  else bannerT.textContent = (stageIx+1)+'판 · '+fmt(G.t)+' · 위협 '+threat()+'단계';
}
function clamp(v,a,b){ return v<a?a:v>b?b:v; }

function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);
  last=ts;

  // **게스트는 시뮬레이션을 돌리지 않는다.** 돌리면 두 화면이 조금씩
  // 갈라지고, 그 차이는 시간이 갈수록 벌어지기만 한다.
  const guest = net.on && net.ready && !net.host;
  if(guest) lerpGuest(); else step(dt);

  if(net.on && net.ready && net.host){
    net.snapT -= dt*1000;
    if(net.snapT<=0){ net.snapT = SNAP_MS; net.send(snapshot()); }
  }

  draw(); hud(dt);
  requestAnimationFrame(loop);
}
paintTeam();
newGame(); resize(); requestAnimationFrame(loop);
// 첫 화면은 로비다. 혼자 할지 붙을지 먼저 고른다.
openLobby();

/**
 * 점검 창구 — **localhost 에서만** 연다.
 *
 * 게임이 통째로 IIFE 안이라 밖에서는 상태를 볼 수 없다. 1v1 은 두 화면을
 * 맞춰 봐야 하는데, 그러려면 양쪽 상태를 꺼내 비교할 수 있어야 한다.
 * 배포본에는 열리지 않는다.
 */
if(location.hostname==='localhost' || location.hostname==='127.0.0.1'){
  Object.assign(globalThis, { STICK:{
    get G(){ return G; }, get net(){ return net; }, get ME(){ return ME; },
    buy, buyUp, castRain, snapshot, order, connect, step, draw, hud, applySnap, lerpGuest,
    units(){ return G.units.map(u=>({t:u.type,s:u.side,x:Math.round(u.x),hp:Math.round(u.hp)})); },
    wallet(){ return {a:Math.round(W('a').gold), b:Math.round(W('b').gold)}; },
  }});
}
})();
</script>
