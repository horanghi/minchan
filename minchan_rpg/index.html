<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover 가 있어야 env(safe-area-inset-*) 가 실제 값을 갖는다 (D-4) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#8fd4f7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Block RPG — 마을에서 시작해 세 군주를 무찌르고 세상 끝의 문을 여는 블록 액션 RPG" />
    <title>Block RPG</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>" />
    <script type="module" crossorigin src="/minchan_rpg/assets/index-B6B-AhhZ.js"></script>
    <link rel="stylesheet" crossorigin href="/minchan_rpg/assets/index-DXdQse1U.css">
  </head>
  <body>
    <!-- 3D 뷰 -->
    <canvas id="view"></canvas>

    <!-- HUD: 항상 떠 있는 것 -->
    <div id="hud" class="hud" aria-live="polite">
      <div class="hud-tl">
        <div class="statblock">
          <div class="row">
            <span id="lvBadge" class="badge">Lv 1</span>
            <span id="clsBadge" class="badge badge-cls hidden"></span>
          </div>
          <div class="bar bar-hp"><i id="hpFill"></i><b id="hpText">100 / 100</b></div>
          <div class="bar bar-xp"><i id="xpFill"></i><b id="xpText">0 / 60</b></div>
        </div>
        <canvas id="minimap" width="116" height="116" aria-label="미니맵"></canvas>
        <div id="statusIcons" class="status-icons" aria-label="상태이상"></div>
      </div>

      <div class="hud-tr">
        <span id="goldBadge" class="badge badge-gold">0 G</span>
        <button id="btnPause" class="icon-btn" title="일시정지 (ESC)" aria-label="일시정지">⏸</button>
        <button id="btnSettings" class="icon-btn" title="설정" aria-label="설정">⚙</button>
        <button id="btnTree" class="icon-btn" title="스킬 트리 (T)" aria-label="스킬 트리">
          🌳<i id="spDot" class="dot hidden"></i>
        </button>
      </div>

      <!-- 다음 목표 (FR-7.10) -->
      <div id="objective" class="objective"></div>

      <!-- 보스 체력바 (FR-7.4) -->
      <div id="bossbar" class="bossbar hidden" role="status"></div>

      <!-- 월드 오버레이: 이름표 · 데미지 숫자 -->
      <div id="worldOverlay" class="world-overlay" aria-hidden="true"></div>

      <div id="toasts" class="toasts"></div>

      <!-- 조작 안내. 모바일에서도 숨기지 않는다 (D-5) -->
      <div id="help" class="help"></div>

      <!-- 접속 상태 / 룸 코드 -->
      <div id="netBadge" class="netbadge" title="접속 상태"></div>
    </div>

    <!-- 터치 컨트롤. 하단 여백은 safe-area 를 반영한다 (D-4) -->
    <div id="touch" class="touch hidden">
      <div id="joyZone" class="joy-zone"></div>
      <div id="joy" class="joy hidden"><i id="joyKnob"></i></div>
      <div class="action-cluster">
        <button id="btnSpecial" class="act act-special" aria-label="특수기">
          <span class="act-label">특수기</span><b id="specialCd"></b>
        </button>
        <button id="btnJump" class="act act-jump" aria-label="점프">점프</button>
        <button id="btnAttack" class="act act-attack" aria-label="공격">공격</button>
      </div>
      <button id="btnShop" class="prompt-btn hidden">🗡 무기점 들어가기</button>
    </div>

    <!-- 전체화면 패널. ESC / 뒤로가기로 최상단부터 닫힌다 (D-3, FR-8.6) -->
    <div id="panels" class="panels"></div>

    <!-- 컷신 (스킵 가능 — FR-4.7) -->
    <div id="cutscene" class="cutscene hidden">
      <div class="cine-bar cine-top"></div>
      <p id="cutCaption" class="cine-caption"></p>
      <div class="cine-bar cine-bottom"></div>
      <button id="btnSkip" class="skip-btn">건너뛰기 ▸</button>
    </div>

    <!-- 로딩 -->
    <div id="boot" class="boot">
      <div class="boot-logo">Block RPG</div>
      <div class="boot-bar"><i id="bootFill"></i></div>
      <div id="bootMsg" class="boot-msg">세계를 짓는 중…</div>
    </div>

  </body>
</html>
